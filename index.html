<body>
<title>City Radius Provider Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: provider = one tall phone column, one job per card, the next step always first.
   Coordinator = two working columns (members waiting | providers) under a site switcher. */
:root{
  --bg:#E8EEEB; --surface:#FFFFFF; --sunk:#DAE3DF; --ink:#13201C; --muted:#475955; --line:#C2CFCA;
  --accent:#0A6157; --accent-ink:#FFFFFF; --accent-soft:#D2E9E3;
  --go:#16703D; --go-ink:#FFFFFF; --go-soft:#DCF0E3;
  --offer:#7E4500; --offer-bg:#FFF0D2; --offer-line:#E3A94F;
  --alert:#A1241A; --alert-bg:#FBE3DF;
  --focus:#1F5ED0;
  --font:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#17211E; --sunk:#111A17; --ink:#E7F0EC; --muted:#A3B5B0; --line:#2B3A36;
    --accent:#56C6B5; --accent-ink:#04211C; --accent-soft:#15352F;
    --go:#47C47B; --go-ink:#052111; --go-soft:#123020;
    --offer:#F4B860; --offer-bg:#30230D; --offer-line:#77521A;
    --alert:#FF8E82; --alert-bg:#3A1713;
    --focus:#8FB4FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#17211E; --sunk:#111A17; --ink:#E7F0EC; --muted:#A3B5B0; --line:#2B3A36;
  --accent:#56C6B5; --accent-ink:#04211C; --accent-soft:#15352F;
  --go:#47C47B; --go-ink:#052111; --go-soft:#123020;
  --offer:#F4B860; --offer-bg:#30230D; --offer-line:#77521A;
  --alert:#FF8E82; --alert-bg:#3A1713;
  --focus:#8FB4FF; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-right:auto}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:18px;height:18px;stroke:var(--accent-ink)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:700;min-height:48px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* generic buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:var(--r-md);border:0;font-size:21px;font-weight:800;padding:12px 18px;text-align:center}
.btn svg{width:26px;height:26px;flex:none}
.btn-go{background:var(--go);color:var(--go-ink)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-line{background:var(--surface);border:2px solid var(--ink);color:var(--ink)}
.btn-quiet{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;font-weight:600;font-size:18px;min-height:52px}
.btn-sm{min-height:48px;font-size:16px;padding:8px 14px;border-radius:var(--r-sm);width:auto}
.btn:disabled{opacity:1;cursor:not-allowed;background:var(--sunk);color:var(--muted);border:2px dashed var(--line)}
.btn:active{transform:translateY(1px)}

/* ===== entry / pick name ===== */
.narrow{max-width:520px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:18px}
.hello h1{font-size:32px;font-weight:800}
.hello p{font-size:19px;color:var(--muted);margin-top:6px}
.choice{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;min-height:88px}
.choice:hover{border-color:var(--ink)}
.choice b{display:block;font-size:22px}
.choice span{display:block;font-size:16px;color:var(--muted)}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.avatar svg{width:28px;height:28px;stroke:var(--accent)}
.group-label{font-size:16px;font-weight:700;color:var(--muted);margin-top:6px}

/* ===== provider ===== */
.phone{max-width:560px;margin:0 auto;padding:18px 16px 120px;display:flex;flex-direction:column;gap:18px}
.who{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.who h1{font-size:30px;font-weight:800}
.who p{color:var(--muted);font-size:17px}
.status{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;border:2px solid var(--line)}
.status.is-off{border-color:var(--ink)}
.status.is-in{border-color:var(--go)}
.is-in .status-ico{background:var(--go-soft)}
.is-in .status-ico svg{stroke:var(--go)}
.status.is-serving{border-color:var(--go);background:var(--go-soft)}
.status-head{display:flex;gap:14px;align-items:flex-start}
.status-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sunk)}
.status-ico svg{width:28px;height:28px;stroke:var(--ink)}
.is-serving .status-ico{background:var(--go);}
.is-serving .status-ico svg{stroke:var(--go-ink)}
.status h2{font-size:25px;font-weight:800}
.status p{font-size:19px;margin-top:4px}
.listen{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;font-size:17px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:4px;min-height:48px;align-self:flex-start}
.listen svg{width:22px;height:22px;stroke:var(--accent)}
.live{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--go);box-shadow:0 0 0 0 var(--go);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--go) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}

@keyframes arrive{0%{transform:scale(.96);box-shadow:0 0 0 0 var(--offer-line)}50%{transform:scale(1.01);box-shadow:0 0 0 10px transparent}100%{transform:none}}
.offer.fresh{animation:arrive .9s ease-out 2}
@media (prefers-reduced-motion: reduce){.offer.fresh{animation:none}}
.offer{background:var(--offer-bg);border:3px solid var(--offer-line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px}
.offer .tag{font-size:17px;font-weight:800;color:var(--offer)}
.offer .name{font-size:30px;font-weight:800;line-height:1.1}
.offer p{font-size:18px}

.sec-title{font-size:20px;font-weight:800;margin-top:6px}
.visit{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.visit-top{display:flex;gap:14px;align-items:center}
.visit .name{font-size:24px;font-weight:800;line-height:1.15}
.visit .since{font-size:17px;color:var(--muted)}
.timer{display:flex;align-items:baseline;gap:10px;background:var(--go-soft);border-radius:var(--r-sm);padding:10px 14px}
.timer b{font-size:28px;font-weight:800;color:var(--go)}
.timer span{font-size:17px;color:var(--muted)}

.notice{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r-md);padding:14px 16px}
.notice p{flex:1;font-size:18px;min-width:0}
.notice > svg{width:28px;height:28px;flex:none;stroke:var(--accent)}
.notice .btn-sm{background:var(--surface);border:2px solid var(--ink)}

.today{background:var(--surface);border-radius:var(--r-lg);padding:18px;border:1px solid var(--line)}
.today dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:18px}
.today dt{color:var(--muted)}
.today dd{margin:0;font-weight:700;text-align:right}
.done-list{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.done-list li{display:flex;justify-content:space-between;gap:12px;font-size:17px}
.done-list b{white-space:nowrap}
.done-list small{display:block;color:var(--muted);font-size:15px}

/* ===== sheets ===== */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;padding-bottom:22px}}
.sheet h2{font-size:26px;font-weight:800}
.sheet .lead{font-size:19px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:14px 16px;min-height:64px;font-size:20px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt small{display:block;font-size:15px;font-weight:400;color:var(--muted)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .grow{flex:1;min-width:0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:16px;color:var(--muted);background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:var(--r-md);font-size:18px;font-weight:600;width:min(520px,calc(100% - 32px));box-shadow:0 10px 30px color-mix(in srgb,#000 30%,transparent);display:flex;gap:12px;align-items:center}
/* T-12 sign-in (prod build) */
.sb-dots{display:flex;justify-content:center;gap:16px;margin:4px 0}
.sb-dots span{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.sb-dots span.on{background:var(--ink)}
.sb-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:360px;margin:0 auto}
.sb-key{min-height:72px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.sb-key.sb-fn{font-size:19px;font-weight:700}
.sb-key:active{transform:translateY(1px);background:var(--accent-soft)}
.sb-key:disabled{opacity:.5;cursor:not-allowed}
.sb-msg{font-size:18px;font-weight:700;color:var(--alert);text-align:center}
.sb-msg.sb-info{color:var(--muted)}
.sb-form{display:flex;flex-direction:column;gap:14px}
.sb-secret{border:3px solid var(--accent)}
.sb-secret-val{font-size:40px;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;word-break:break-all}
.sb-cell{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sb-staff-form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.sb-staff-form select{font:inherit;font-size:19px;min-height:56px;padding:10px;border-radius:var(--r-sm);border:2px solid var(--ink);background:var(--surface);color:var(--ink);width:100%}
.sb-idle{align-items:center;z-index:40}
.sb-idle .sheet{border-radius:24px;margin:16px}
.toast .tq{display:block;font-size:16px;font-weight:600;opacity:.85;margin-top:2px}
.obar{max-width:640px;margin:12px auto 0;padding:0 16px}
.obar-in{display:flex;gap:12px;align-items:flex-start;background:var(--sunk);border-left:6px solid var(--accent);border-radius:var(--r-sm);padding:12px 14px}
.obar-in svg{width:26px;height:26px;flex:none;margin-top:2px;stroke:currentColor}
.obar-in p{font-size:18px;font-weight:600;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.obar-in p span{display:block;font-size:17px;font-weight:800;margin-top:4px}
.obadge-row{max-width:1180px;margin:8px auto 0;padding:0 16px;display:flex;justify-content:flex-end}
.obadge{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.toast .undo{pointer-events:auto;margin-left:auto;background:var(--bg);color:var(--ink);border:0;border-radius:var(--r-sm);min-height:48px;padding:8px 16px;font-weight:800;font-size:18px}
.has-sheet #toast{display:none}
.toast.err{background:var(--alert);color:#fff}
.toast svg{width:24px;height:24px;flex:none;stroke:currentColor}

/* ===== coordinator ===== */
.board{max-width:1180px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:16px}
.board-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.board-head h1{font-size:26px;font-weight:800;margin-right:auto}
.sites{display:flex;gap:6px;flex-wrap:wrap}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.count{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.count b{display:block;font-size:28px;font-weight:800}
.count span{font-size:15px;color:var(--muted)}
.count.hot{border:2px solid var(--offer-line);background:var(--offer-bg)}
button.count{font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;position:relative}
button.count::after{content:'\203A';position:absolute;right:12px;top:8px;font-size:22px;color:var(--muted)}
button.count:hover{border-color:var(--ink)}
.geo-site{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.geo-form{display:grid;gap:10px;padding:14px;margin:10px 0;border:2px solid var(--line);border-radius:var(--r-md)}
.geo-pill{white-space:nowrap}
.jump-hi{outline:3px solid var(--offer-line);outline-offset:3px;border-radius:var(--r-md);transition:outline-color .4s}
@media (prefers-reduced-motion: reduce){.jump-hi{transition:none}}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--alert-bg);border-left:6px solid var(--alert);border-radius:var(--r-sm);padding:10px 12px}
.alert p{flex:1 1 260px;font-size:17px;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.pill-off{background:var(--sunk);color:var(--muted)}
.pw-row{display:flex;gap:8px;align-items:stretch}.pw-row input{flex:1 1 auto;min-width:0;width:auto}.eye-btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:56px;min-height:56px;padding:0;border-radius:var(--r-sm);border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}.eye-btn svg{width:26px;height:26px}.eye-btn:focus-visible{outline:3px solid var(--focus,#1a5fd0);outline-offset:2px}.sb-pin-row{display:flex;align-items:center;justify-content:center;gap:14px}.sb-dots span.dig{border:0;width:auto;min-width:22px;height:auto;border-radius:0;font-size:24px;font-weight:800;line-height:22px;text-align:center}
.ph-file-btn{position:relative;cursor:pointer}.ph-file-btn.is-busy{opacity:.7;pointer-events:none}.ph-file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}.ph-file-btn:focus-within{outline:3px solid var(--focus,#1a5fd0);outline-offset:2px}
.push-card p{margin:0 0 10px}.push-steps{margin:0 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:6px}.push-on{display:flex;align-items:center;gap:8px;margin:0;color:var(--muted,#555);font-size:16px}.push-on svg{width:20px;height:20px;flex:0 0 auto}.push-on span{flex:1}
.sb-pin{font-size:22px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
@media print{body *{visibility:hidden}.sb-pins,.sb-pins *{visibility:visible}.sb-pins{position:absolute;left:0;top:0;width:100%;border:0}.sb-pins .no-print{display:none}.sb-pins .scroll{overflow:visible}.sb-pin-tbl tr{page-break-inside:avoid}.dr-rep,.dr-rep *{visibility:visible}.dr-rep{position:absolute;left:0;top:0;width:100%;padding:0}.dr-rep .no-print,.dr-rep .tabs,.dr-rep .sites{display:none}.dr-rep .scroll{overflow:visible}.dr-rep .panel{break-inside:avoid;box-shadow:none}.dr-rep .tbl tr{page-break-inside:avoid}}
.ph-cam{display:flex;flex-direction:column;align-items:center;gap:8px}
.ph-big{width:100%;max-width:300px;aspect-ratio:1/1;object-fit:cover;border-radius:18px;background:var(--sunk);border:1px solid var(--line,rgba(0,0,0,.15))}
.ph-wait{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:18px;padding:12px}
.ph-msg{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:14px;padding:14px;font-size:18px}
.ph-msg svg{width:26px;height:26px;flex:none}
.ph-note{font-size:15px;text-align:center}
.ph-thumb{display:inline-flex;width:44px;height:44px;min-height:44px;padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--line,rgba(0,0,0,.2));background:var(--sunk);cursor:pointer;vertical-align:middle;flex:none}
.ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
span.ph-thumb{cursor:default}
.ph-thumb:focus-visible{outline:3px solid var(--focus,#1a5fd0);outline-offset:2px}
.ph-pill{white-space:nowrap}
.ph-cell{text-align:center;white-space:nowrap}
.pill-free{background:var(--alert-bg);color:var(--alert)}
.pill-offer{background:var(--offer-bg);color:var(--offer)}
.pill-serving{background:var(--go-soft);color:var(--go)}
.pill-count{background:var(--sunk);color:var(--ink)}
.row{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:10px}
.row-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

      // Allowed while clocked_in, auto_signed_off or correction_pending; locked once signed_off or corrected.
      var nsh = shiftFor(state, asg.providerId, asg.date);
      if (isLocked(nsh)) return fail('DAY_LOCKED', { providerName: providerName(state, asg.providerId), status: nsh.status });
      var upd = withFields(asg, { notesCompleted: a.done, notesAt: a.done ? ctx.now : null, notesBy: ctx.by == null ? null : ctx.by });
      var ev = makeEvent(ctx, date, 'notes', { siteId: asg.siteId, memberId: asg.memberId, providerId: asg.providerId, assignmentId: asg.id, done: a.done });
      return done([{ col: 'assignments', id: upd.id, doc: upd }], ev);
    },

    // End the provider's day with an attestation (BR-10, BR-11, BR-12).
    signOff: function (state, a, ctx, date) {
      var p = provider(state, a.providerId);
      if (!p) return fail('NOT_FOUND', { what: 'provider', id: a.providerId });
      var sh = shiftFor(state, p.id, date);
      if (sh && !isClockedIn(sh) && (isSignedOff(sh) || isAutoStatus(sh.status))) {
        return fail('ALREADY_SIGNED_OFF', { providerName: p.name, status: sh.status, at: timeLabel(sh.signedOffAt != null ? sh.signedOffAt : sh.clockOutAt) });
      }
      if (!isClockedIn(sh)) return fail('NOT_CLOCKED_IN', { providerName: p.name });
      if (typeof a.attestation !== 'string' || !a.attestation.trim()) return fail('INVALID', { field: 'attestation', value: a.attestation == null ? null : a.attestation });
      var lang = a.lang == null ? 'en' : a.lang;
      if (ATTEST_LANGS.indexOf(lang) < 0) return fail('INVALID', { field: 'lang', value: lang, allowed: ATTEST_LANGS.slice() });
      var co = checkout(state, p.id, date, ctx.now);
      if (!co.ready) {
        return fail('NOT_READY', {
          providerName: p.name,
          active: co.active.map(idOf), offers: co.offers.map(idOf), missingNotes: co.missingNotes.map(idOf)
        });
      }
      var upd = withFields(sh, { status: 'signed_off', clockOutAt: ctx.now, signedOffAt: ctx.now, attestation: a.attestation, attestationLang: lang });
      var ev = makeEvent(ctx, date, 'signOff', { siteId: sh.siteId, providerId: p.id });
      return done([{ col: 'shifts', id: upd.id, doc: upd }], ev);
    },

    // ---------- step 3 ----------
    // Close every open shift at the site at cutoffAt (BR-13, BR-14). Repeat sweeps → NOTHING_TO_DO.
    autoSignOff: function (state, a, ctx) {
      var s = site(state, a.siteId);
      if (!s) return fail('NOT_FOUND', { what: 'site', id: a.siteId });
      var cutoffAt = a.cutoffAt;
      if (typeof cutoffAt !== 'number' || !isFinite(cutoffAt)) return fail('INVALID', { field: 'cutoffAt', value: cutoffAt == null ? null : cutoffAt });
      if (ctx.now < cutoffAt) return fail('TOO_EARLY', { siteName: s.name, at: timeLabel(cutoffAt) });
      var day = dateKey(cutoffAt);
      var writes = [];
      var count = 0;
      arr(state.shifts).forEach(function (sh) {
        if (sh.siteId !== s.id || sh.date !== day || sh.status !== 'clocked_in') return;
        var u = withFields(sh, { status: 'auto_signed_off', clockOutAt: cutoffAt, autoSignedOffAt: cutoffAt });
        writes.push({ col: 'shifts', id: u.id, doc: u });
        count++;
      });
      assignmentsOn(state, day).forEach(function (x) {
        if (x.siteId !== s.id) return;
        if (x.status === 'active') {
          var end = x.acceptedAt != null && x.acceptedAt > cutoffAt ? x.acceptedAt : cutoffAt;
          var e = withFields(x, { status: 'ended', endReason: 'auto_signoff', endedAt: end, endedBy: 'system' });
          writes.push({ col: 'assignments', id: e.id, doc: e });
        } else if (x.status === 'offered') {
          var wd = withFields(x, { status: 'withdrawn', endReason: 'auto_signoff', endedAt: cutoffAt, endedBy: 'system' });
          writes.push({ col: 'assignments', id: wd.id, doc: wd });
        }
      });
      arr(state.checkins).forEach(function (c) {
        if (c.siteId !== s.id || c.date !== day || c.checkedOutAt) return;
        // Never check out before the check-in itself (a check-in made after the cutoff time).
        var out = c.checkedInAt != null && c.checkedInAt > cutoffAt ? c.checkedInAt : cutoffAt;
        var cc = withFields(c, { checkedOutAt: out });
        writes.push({ col: 'checkins', id: cc.id, doc: cc });
      });
      if (!writes.length) return fail('NOTHING_TO_DO', { siteName: s.name, date: day });
      var ev = makeEvent(ctx, day, 'autoSignOff', { siteId: s.id, count: count });
      return done(writes, ev);
    },

    // "Forgot to Sign Off" form (BR-15..BR-18, EC-12..EC-15).
    submitCorrection: function (state, a, ctx) {
      var p = provider(state, a.providerId);
      if (!p) return fail('NOT_FOUND', { what: 'provider', id: a.providerId });
      var sh = shiftFor(state, p.id, a.date);
      if (!sh) return fail('NOT_FOUND', { what: 'shift', providerId: p.id, date: a.date == null ? null : a.date });
      var err = checkCorrectable(state, sh, p);
      if (err) return err;
      var byCoordinator = a.byCoordinator === true;
      if (!byCoordinator && hasRejected(state, sh.id)) return fail('FORM_REJECTED', { providerName: p.name, date: sh.date });
      err = checkEndAt(sh, a.endAt);
      if (err) return err;
      var used = businessDaysBetween(sh.date, dateKey(ctx.now));
      if (used > CORRECTION_WINDOW_DAYS && !byCoordinator) {
        return fail('WINDOW_CLOSED', { providerName: p.name, date: sh.date, businessDays: used, max: CORRECTION_WINDOW_DAYS });
      }
      if (typeof a.attestation !== 'string' || !a.attestation.trim()) return fail('INVALID', { field: 'attestation', value: a.attestation == null ? null : a.attestation });
      if (CORRECTION_REASONS.indexOf(a.reason) < 0) return fail('INVALID', { field: 'reason', value: a.reason == null ? null : a.reason, allowed: CORRECTION_REASONS.slice() });
      var corr = {
        id: ctx.ids(), shiftId: sh.id, providerId: p.id, siteId: sh.siteId, date: sh.date,
        submittedBy: ctx.by == null ? null : ctx.by, submittedAt: ctx.now, byCoordinator: byCoordinator,
        claimedEndAt: a.endAt, reason: a.reason, attestation: a.attestation,
        status: 'pending', conflicts: conflictsFor(state, p.id, sh.date, a.endAt),
        decidedBy: null, decidedAt: null, finalEndAt: null, comment: null
      };
      var ush = withFields(sh, { status: 'correction_pending', correctionId: corr.id });
      var ev = makeEvent(ctx, sh.date, 'correctionSubmitted', { siteId: sh.siteId, providerId: p.id, correctionId: corr.id, reason: a.reason });
      return done([{ col: 'corrections', id: corr.id, doc: corr }, { col: 'shifts', id: ush.id, doc: ush }], ev);
    },

    // Verifier decides a pending form (BR-17 verifier ≠ submitter).
    decideCorrection: function (state, a, ctx) {
      var corr = findById(state.corrections, a.correctionId);
      if (!corr) return fail('NOT_FOUND', { what: 'correction', id: a.correctionId });
      if (corr.status !== 'pending') return fail('NOT_PENDING', { status: corr.status });
      var pName = providerName(state, corr.providerId);
      if (ctx.by != null && ctx.by === corr.submittedBy) return fail('SELF_VERIFY', { providerName: pName });
      if (CORRECTION_DECISIONS.indexOf(a.decision) < 0) return fail('INVALID', { field: 'decision', value: a.decision == null ? null : a.decision, allowed: CORRECTION_DECISIONS.slice() });
      var sh = findById(state.shifts, corr.shiftId);
      if (!sh) return fail('NOT_FOUND', { what: 'shift', id: corr.shiftId });
      var comment = typeof a.comment === 'string' ? a.comment.trim() : '';
      if (!comment && (a.decision !== 'approve' || arr(corr.conflicts).length > 0)) {
        return fail('COMMENT_REQUIRED', { decision: a.decision, conflicts: arr(corr.conflicts).length });
      }
      var by = ctx.by == null ? null : ctx.by;
      var ev = makeEvent(ctx, sh.date, 'correctionDecided', { siteId: sh.siteId, providerId: sh.providerId, correctionId: corr.id, decision: a.decision });
      if (a.decision === 'reject') {
        var rc = withFields(corr, { status: 'rejected', decidedBy: by, decidedAt: ctx.now, comment: comment });
        var rs = withFields(sh, { status: 'auto_signed_off' }); // correctionId kept
        return done([{ col: 'corrections', id: rc.id, doc: rc }, { col: 'shifts', id: rs.id, doc: rs }], ev);
      }
      var finalEnd = corr.claimedEndAt;
      if (a.decision === 'adjust') {
        var err = checkEndAt(sh, a.endAt);
        if (err) return err;
        finalEnd = a.endAt;
      }
      var dc = withFields(corr, {
        status: a.decision === 'approve' ? 'approved' : 'adjusted',
        decidedBy: by, decidedAt: ctx.now, finalEndAt: finalEnd, comment: comment || null
      });
      var writes = [{ col: 'corrections', id: dc.id, doc: dc }].concat(finalizeShift(state, sh, finalEnd, ctx, comment || null));
      return done(writes, ev);
    },

    // Coordinator closes an auto-signed-off day directly (endAt == autoSignedOffAt keeps the cutoff, BR-15).
    coordinatorCorrect: function (state, a, ctx) {
      var p = provider(state, a.providerId);
      if (!p) return fail('NOT_FOUND', { what: 'provider', id: a.providerId });
      var sh = shiftFor(state, p.id, a.date);
      if (!sh) return fail('NOT_FOUND', { what: 'shift', providerId: p.id, date: a.date == null ? null : a.date });
      var err = checkCorrectable(state, sh, p);
      if (err) return err;
      var comment = typeof a.comment === 'string' ? a.comment.trim() : '';
      if (!comment) return fail('COMMENT_REQUIRED', { decision: 'coordinatorCorrect' });
      err = checkEndAt(sh, a.endAt);
      if (err) return err;
      var ev = makeEvent(ctx, sh.date, 'coordinatorCorrect', { siteId: sh.siteId, providerId: p.id });
      return done(finalizeShift(state, sh, a.endAt, ctx, comment), ev);
    }
  };

  // Shift must be auto_signed_off (not pending, not final, not still open).
  function checkCorrectable(state, sh, p) {
    if (sh.status === 'correction_pending') return fail('FORM_PENDING', { providerName: p.name, date: sh.date });
    if (isLocked(sh)) return fail('DAY_LOCKED', { providerName: p.name, date: sh.date, status: sh.status });
    if (sh.status !== 'auto_signed_off') return fail('NOT_AUTO', { providerName: p.name, date: sh.date, status: sh.status });
    return null;
  }

  // A correction may only shorten or confirm the day (BR-14, BR-18).
  function checkEndAt(sh, endAt) {
    if (typeof endAt !== 'number' || !isFinite(endAt)) return fail('INVALID', { field: 'endAt', value: endAt == null ? null : endAt });
    if (endAt > sh.autoSignedOffAt) return fail('AFTER_CUTOFF', { at: timeLabel(sh.autoSignedOffAt) });
    if (endAt < sh.clockInAt) return fail('BEFORE_CLOCK_IN', { at: timeLabel(sh.clockInAt) });
    return null;
  }

  // EC-14: recorded activity after the claimed end time. One entry per visit; 'started_after' wins over 'ended_after'.
  function conflictsFor(state, providerId, date, claimedEndAt) {
    var out = [];
    assignmentsOn(state, date).forEach(function (x) {
      if (x.providerId !== providerId || x.acceptedAt == null) return;
      if (x.status !== 'ended' && x.status !== 'active') return;
      if (x.acceptedAt > claimedEndAt) {
        out.push({ assignmentId: x.id, memberId: x.memberId, kind: 'started_after', at: x.acceptedAt });
      } else if (x.status === 'ended' && x.endReason !== 'auto_signoff' && x.endedAt != null && x.endedAt > claimedEndAt) {
        out.push({ assignmentId: x.id, memberId: x.memberId, kind: 'ended_after', at: x.endedAt });
      }
    });
    return out.sort(function (p, q) { return (p.at - q.at) || (p.assignmentId < q.assignmentId ? -1 : 1); });
  }

  // Shift → corrected at finalEnd, and trim the visits that auto sign-off ended.
  function finalizeShift(state, sh, finalEnd, ctx, comment) {
    var by = ctx.by == null ? null : ctx.by;
    var us = withFields(sh, {
      status: 'corrected', clockOutAt: finalEnd, finalEndAt: finalEnd,
      correctedAt: ctx.now, correctedBy: by, correctionComment: comment
    });
    var writes = [{ col: 'shifts', id: us.id, doc: us }];
    assignmentsOn(state, sh.date).forEach(function (x) {
      if (x.providerId !== sh.providerId || x.status !== 'ended' || x.endReason !== 'auto_signoff') return;
      var start = x.acceptedAt;
      if (start == null) return;
      var f = {};
      if (start >= finalEnd) { f.endedAt = start; f.trimmed = true; }
      else {
        var end = x.endedAt != null && x.endedAt < finalEnd ? x.endedAt : finalEnd;
        if (end !== x.endedAt) f.endedAt = end;
      }
      if (Object.keys(f).length) {
        var t = withFields(x, f);
        writes.push({ col: 'assignments', id: t.id, doc: t });
      }
    });
    return writes;
  }

  function idOf(x) { return x.id; }

  function apply(state, action, ctx) {
    if (!action || typeof action.type !== 'string' || !Object.prototype.hasOwnProperty.call(handlers, action.type)) {
      return fail('UNKNOWN_ACTION', { type: action && action.type });
    }
    if (!ctx || typeof ctx.now !== 'number' || typeof ctx.ids !== 'function') {
      return fail('BAD_CONTEXT', {});
    }
    // T-15: no SSN, phone or email ever enters a record (comments, reasons, notes, ...)
    var sens = sensitiveField(action);
    if (sens) return fail('SENSITIVE', { field: sens.field });
    return handlers[action.type](state || {}, action, ctx, dateKey(ctx.now));
  }

  function reduce(state, writes) {
    var next = copy(state || {});
    var touched = {};
    arr(writes).forEach(function (w) {
      if (!w || !w.col || w.id == null) return;
      if (!touched[w.col]) { next[w.col] = arr(next[w.col]).slice(); touched[w.col] = true; }
      var list = next[w.col];
      var idx = -1;
      for (var i = 0; i < list.length; i++) if (list[i] && list[i].id === w.id) { idx = i; break; }
      if (idx >= 0) list[idx] = w.doc; else list.push(w.doc);
    });
    ['shifts', 'checkins', 'assignments', 'events', 'corrections'].forEach(function (k) { if (!next[k]) next[k] = []; });
    return next;
  }

  // ---------- derived ----------
  function visitMinutes(a, now) {
    if (!a || a.acceptedAt == null) return 0;
    if (a.status === 'active') return minutesBetween(a.acceptedAt, now);
    if (a.status === 'ended') return minutesBetween(a.acceptedAt, a.endedAt);
    return 0;
  }

  function visitInterval(a, now) {
    if (!a || a.acceptedAt == null) return null;
    var end = a.status === 'active' ? now : a.status === 'ended' ? a.endedAt : null;
    if (end == null || end <= a.acceptedAt) return null;
    return [a.acceptedAt, end];
  }

  function unionMs(intervals) {
    var list = intervals.filter(Boolean).slice().sort(function (x, y) { return x[0] - y[0]; });
    var total = 0, curS = null, curE = null;
    list.forEach(function (iv) {
      if (curS === null) { curS = iv[0]; curE = iv[1]; return; }
      if (iv[0] <= curE) { if (iv[1] > curE) curE = iv[1]; }
      else { total += curE - curS; curS = iv[0]; curE = iv[1]; }
    });
    if (curS !== null) total += curE - curS;
    return total;
  }

  function byTime(field) { return function (x, y) { return (x[field] || 0) - (y[field] || 0); }; }

  function providerDay(state, providerId, date, now) {
    state = state || {};
    var shift = shiftFor(state, providerId, date);
    var clockedIn = isClockedIn(shift);
    var clockInAt = shift ? shift.clockInAt : null;
    var presenceEnd = shift && shift.clockOutAt != null ? shift.clockOutAt : now;
    var presenceMin = shift ? minutesBetween(shift.clockInAt, presenceEnd) : 0;
    var mine = assignmentsOn(state, date).filter(function (a) { return a.providerId === providerId; });
    var offers = mine.filter(function (a) { return a.status === 'offered'; }).sort(byTime('offeredAt'));
    var active = mine.filter(function (a) { return a.status === 'active'; }).sort(byTime('acceptedAt'));
    var finished = mine.filter(function (a) { return a.status === 'ended'; }).sort(byTime('acceptedAt'));
    var visits = active.concat(finished);
    var serviceMin = 0, unitSum = 0;
    visits.forEach(function (a) { var v = visitMinutes(a, now); serviceMin += v; unitSum += units(v); });
    var withMemberMin = Math.floor(unionMs(visits.map(function (a) { return visitInterval(a, now); })) / MIN_MS);
    var waitingMin = presenceMin - withMemberMin;
    if (waitingMin < 0) waitingMin = 0;
    var status = shift ? shift.status : null;
    return {
      shift: shift, clockedIn: clockedIn, clockInAt: clockInAt, presenceMin: presenceMin,
      signedOff: isSignedOff(shift), signedOffAt: shift && shift.signedOffAt != null ? shift.signedOffAt : null,
      status: status, autoSignedOff: isAutoStatus(status),
      autoSignedOffAt: shift && shift.autoSignedOffAt != null ? shift.autoSignedOffAt : null,
      correction: shift ? latestCorrection(state, shift.id) : null,
      finalEndAt: shift && shift.finalEndAt != null ? shift.finalEndAt : null,
      offers: offers, active: active, finished: finished,
      serviceMin: serviceMin, withMemberMin: withMemberMin, waitingMin: waitingMin, units: unitSum
    };
  }

  function checkout(state, providerId, date, now) {
    state = state || {};
    var day = providerDay(state, providerId, date, now);
    var missingNotes = day.finished.filter(function (a) { return !a.notesCompleted; });
    var doneNotes = day.finished.filter(function (a) { return !!a.notesCompleted; });
    return {
      shift: day.shift, clockedIn: day.clockedIn, signedOff: day.signedOff,
      active: day.active, offers: day.offers, missingNotes: missingNotes, doneNotes: doneNotes,
      ready: day.clockedIn && !day.active.length && !day.offers.length && !missingNotes.length,
      day: day
    };
  }

  var STATE_ORDER = { offer: 0, free: 1, serving: 2, correction_pending: 3, auto_signed_off: 4, signed_off: 5, corrected: 6, off: 7 };
  var CLOSED_STATES = { signed_off: 1, auto_signed_off: 1, correction_pending: 1, corrected: 1 };
  function byName(x, y) { var a = (x || '').toLowerCase(), b = (y || '').toLowerCase(); return a < b ? -1 : a > b ? 1 : 0; }

  function board(state, siteId, date, now) {
    state = state || {};
    var r = roster(state);
    var s = site(state, siteId);
    var maxRatio = maxRatioOf(s);
    var todays = assignmentsOn(state, date);
    var todaysCheckins = arr(state.checkins).filter(function (c) { return c.date === date; });

    // Waiting: open checkin at this site, no ACTIVE assignment.
    var waiting = [];
    arr(r.members).forEach(function (m) {
      var c = openCheckin(state, m.id, date);
      if (!c || c.siteId !== siteId) return;
      var mineToday = todays.filter(function (a) { return a.memberId === m.id; });
      var need = staffNeedOf(m);
      var withNow = mineToday.filter(function (a) { return a.status === 'active'; });
      if (withNow.length >= need) return;
      var offer = null, offers = [];
      mineToday.forEach(function (a) { if (a.status === 'offered') { offers.push(a); if (!offer || a.offeredAt > offer.offeredAt) offer = a; } });
      // Waiting clock restarts when a visit ends (e.g. reassigned) during this checkin.
      var since = c.checkedInAt;
      mineToday.forEach(function (a) {
        if (a.status === 'ended' && a.endedAt != null && a.endedAt >= c.checkedInAt && a.endedAt > since) since = a.endedAt;
      });
      waiting.push({ member: m, checkin: c, waitMin: minutesBetween(since, now), offer: offer, offers: offers,
        need: need, withNow: withNow, open: need - withNow.length - offers.length });
    });
    waiting.sort(function (x, y) { return (y.waitMin - x.waitMin) || byName(x.member.name, y.member.name); });

    var notArrived = arr(r.members).filter(function (m) {
      return m.siteId === siteId && m.active !== false && !todaysCheckins.some(function (c) { return c.memberId === m.id; });
    }).sort(function (x, y) { return byName(x.name, y.name); });

    // Providers: those clocked in here today, plus home-site providers with no shift anywhere today.
    var providers = [];
    arr(r.providers).forEach(function (p) {
      var sh = shiftFor(state, p.id, date);
      if (sh ? sh.siteId !== siteId : (p.siteId !== siteId || p.active === false)) return;
      var day = providerDay(state, p.id, date, now);
      var st = CLOSED_STATES[day.status] ? day.status : !day.clockedIn ? 'off' : day.active.length ? 'serving' : day.offers.length ? 'offer' : 'free';
      var freeSinceMin = null;
      if (day.clockedIn) {
        if (day.active.length) freeSinceMin = 0;
        else {
          var since = day.clockInAt;
          day.finished.forEach(function (a) { if (a.endedAt != null && a.endedAt > since) since = a.endedAt; });
          freeSinceMin = minutesBetween(since, now);
        }
      }
      var room = day.clockedIn ? maxRatio - providerLoad(state, p.id, date, s) : 0;
      if (room < 0) room = 0;
      var notesMissing = day.finished.filter(function (a) { return !a.notesCompleted; }).length;
      providers.push({
        provider: p, day: day, state: st, load: day.active.length, room: room, freeSinceMin: freeSinceMin,
        notesMissing: notesMissing, visitsEnded: day.finished.length
      });
    });
    providers.sort(function (x, y) { return (STATE_ORDER[x.state] - STATE_ORDER[y.state]) || byName(x.provider.name, y.provider.name); });

    var alerts = [];
    todays.forEach(function (a) {
      if (a.siteId !== siteId || a.status !== 'offered') return;
      var min = minutesBetween(a.offeredAt, now);
      if (min >= CONFIG.offerAlertMin) alerts.push({ kind: 'offer_waiting', assignment: a, min: min });
    });
    if (waiting.length) {
      providers.forEach(function (pv) {
        if (pv.state === 'free' && pv.freeSinceMin >= FREE_ALERT_MIN) alerts.push({ kind: 'provider_free', provider: pv.provider, min: pv.freeSinceMin });
      });
    }
    providers.forEach(function (pv) {
      var sh = pv.day.shift;
      if (pv.state === 'correction_pending') {
        var corr = pv.day.correction;
        alerts.push({ kind: 'correction_pending', correction: corr, provider: pv.provider, min: corr ? minutesBetween(corr.submittedAt, now) : 0 });
      } else if (pv.state === 'auto_signed_off') {
        // min (since the cutoff) is extra, so alerts stay sortable.
        alerts.push({ kind: 'auto_unverified', shift: sh, provider: pv.provider, min: minutesBetween(sh.autoSignedOffAt, now) });
      }
    });
    alerts.sort(function (x, y) { return y.min - x.min; });

    var siteOffers = todays.filter(function (a) { return a.siteId === siteId && a.status === 'offered'; }).length;
    var siteActive = todays.filter(function (a) { return a.siteId === siteId && a.status === 'active'; }).length;
    var counts = {
      waiting: waiting.length,
      free: providers.filter(function (p) { return p.state === 'free'; }).length,
      offers: siteOffers,
      serving: siteActive,
      providersIn: providers.filter(function (p) { return p.day.clockedIn; }).length
    };

    var events = arr(state.events).filter(function (e) { return e.siteId === siteId && e.date === date; })
      .map(function (e, i) { return { e: e, i: i }; })
      .sort(function (x, y) { return (y.e.at - x.e.at) || (y.i - x.i); })
      .map(function (x) { return x.e; });

    return { waiting: waiting, notArrived: notArrived, providers: providers, alerts: alerts, counts: counts, events: events };
  }

  function withinLookback(date, today) {
    var d = calendarDaysBetween(date, today);
    return d !== null && d >= 0 && d <= FIXES_LOOKBACK_DAYS;
  }

/* ---------- T-31 photo at clock-in ----------
   One photo per clock-in, for a person to confirm who clocked in (no face matching). The app takes a 320x320 JPEG from the front camera and
   sends it to private storage; only HR and the site's coordinator can open it, and it is deleted after keepDays.
   A photo can never block a clock-in: no camera or "without a photo" still clocks in, and is shown as such. */
const PHOTO = { on: true, keepDays: 90, size: 320, quality: 0.7 };
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

const cam = { stream: null, state: 'idle', busy: false };
function camStart(){
  cam.busy = false;
  
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ cam.state = 'none'; return; }
  cam.state = 'starting';
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } }, audio: false })
    .then(st => { if(!ui.sheet || ui.sheet.kind !== 'photo'){ st.getTracks().forEach(x => x.stop()); return; } cam.stream = st; cam.state = 'live'; render(); })
    .catch(() => { cam.state = 'none'; render(); });
}
function camStop(){ if(cam.stream){ cam.stream.getTracks().forEach(x => { try{ x.stop(); }catch(e){} }); cam.stream = null; } if(cam.state !== 'idle') cam.state = 'idle'; cam.busy = false; }
function camAttach(){
  const v = document.getElementById('cam-video');

}
function camGrab(){
  return new Promise(res => {
    const v = document.getElementById('cam-video');
    if(!v || !v.videoWidth || !v.videoHeight) return res(null);
    const n = PHOTO.size, side = Math.min(v.videoWidth, v.videoHeight);
    const c = document.createElement('canvas'); c.width = n; c.height = n;
    c.getContext('2d').drawImage(v, (v.videoWidth - side) / 2, (v.videoHeight - side) / 2, side, side, 0, 0, n, n);
    c.toBlob(b => res(b && b.size ? b : null), 'image/jpeg', PHOTO.quality);
  });
}

// iPhone / in-app browsers without a live camera: the phone's own camera via a file input, cut to the same square JPEG
function fileToJpeg(file){
  return new Promise(res => {
    if(!file || !/^image\//.test(file.type || 'image/')) return res(null);
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight, n = PHOTO.size, side = Math.min(w, h);
      if(!side){ URL.revokeObjectURL(u); return res(null); }
      const c = document.createElement('canvas'); c.width = n; c.height = n;
      c.getContext('2d').drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, n, n);
      URL.revokeObjectURL(u);
      c.toBlob(b => res(b && b.size ? b : null), 'image/jpeg', PHOTO.quality);
    };
    img.onerror = () => { URL.revokeObjectURL(u); res(null); };
    img.src = u;
  });
}

/* ---------- actions ---------- */
/* ---------- offline outbox (EC-16) ----------
   Writes that could not be sent wait here, in order, and are mirrored to
   localStorage ('vh2.outbox') so a refresh does not lose them. */
const OB_BASE = 20000, OB_MAX = 60000, OB_TIMEOUT = 20000;
const outbox = { items: obClean(LS.get('outbox', [])), wait: OB_BASE, timer: 0, busy: false, sentSome: false };
const obNote = { pending: false };
let obChain = Promise.resolve();
// pure helpers
function obClean(v){ return Array.isArray(v) ? v.filter(x => x && Array.isArray(x.writes) && x.writes.length) : []; }
function obWrites(items){ const out = []; (items||[]).forEach(it => (it.local||it.writes||[]).forEach(w => out.push(w))); return out; }
function obCount(items){ return (items||[]).filter(it => it && it.writes && it.writes.length).length; }
function obNextWait(w){ return Math.min(OB_MAX, Math.max(OB_BASE, (w||OB_BASE) * 2)); }
function obOverlay(st){ return outbox.items.length ? E.reduce(st, obWrites(outbox.items)) : st; }
// storage + sending
function obSave(){ LS.set('outbox', outbox.items); }
function obSet(w){
  return Promise.race([
    Promise.resolve().then(() => db.collection(w.col).doc(w.id).set(w.doc)),
    new Promise((_, no) => setTimeout(() => no(new Error('timeout')), OB_TIMEOUT))
  ]);
}
function obSchedule(){
  clearTimeout(outbox.timer); outbox.timer = 0;
  if(outbox.items.length) outbox.timer = setTimeout(obFlush, outbox.wait);
}
function obPush(item){ outbox.items.push(item); obSave(); obSchedule(); render(); }
// Send an action's writes now, or put them (and whatever is left) behind the queue. Resolves true if queued.
function obSend(type, writes, at, local){
  const step = obChain.then(async () => {
    let i = 0;
    if(!outbox.items.length && navigator.onLine !== false){
      for(; i < writes.length; i++){ try{ await obSet(writes[i]); }catch(e){ break; } }
    }
    if(i >= writes.length) return false;
    obPush(local ? { qid: newId(), at, type, writes: writes.slice(i), local } : { qid: newId(), at, type, writes: writes.slice(i) });
    return true;
  });
  obChain = step.catch(() => {});
  return step;
}
async function obFlush(){
  if(!db || outbox.busy || !outbox.items.length) return;
  if(navigator.onLine === false){ obSchedule(); return; }
  outbox.busy = true; clearTimeout(outbox.timer); outbox.timer = 0;
  let failed = false;
  try{
    while(outbox.items.length && !failed){
      const it = outbox.items[0];
      while(it.writes.length){
        try{ await obSet(it.writes[0]); }catch(e){ failed = true; break; }
        it.writes.shift(); outbox.sentSome = true; obSave();
      }
      if(!failed){ outbox.items.shift(); obSave(); }
    }
  }finally{ outbox.busy = false; }
  if(failed){ outbox.wait = obNextWait(outbox.wait); obSchedule(); render(); return; }
  outbox.wait = OB_BASE;
  render();
  if(outbox.sentSome){ outbox.sentSome = false; toast(t('q_done')); }
}
function obStart(){
  if(outbox.started) return; outbox.started = true;
  window.addEventListener('online', () => { outbox.wait = OB_BASE; obFlush(); });
  window.addEventListener('offline', () => render());
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') obFlush(); });
  setTimeout(obFlush, 0);
}
function obNoteSoon(){ obNote.pending = true; setTimeout(() => { if(obNote.pending){ obNote.pending = false; toast(t('q_saved')); } }, 0); }
function obStrip(){
  const n = obCount(outbox.items);
  if(!n || !ui.role) return '';
  const c = n === 1 ? t('q_count1') : t('q_countN', {n});
  if(ui.role === 'provider') return `<div class="obar" role="status"><div class="obar-in">${I.alert}<p>${esc(t('q_banner'))}<span>${esc(c)}</span></p></div></div>`;
  return `<div class="obadge-row" role="status"><span class="pill obadge">${esc(c)}</span></div>`;
}
if(outbox.items.length) state = obOverlay(state);

async function act(action, opts){
  opts = opts || {};
  const now = opts.now != null ? opts.now : Date.now();
  const usedIds = [];
  const r = E.apply(eff(), action, { now, by: opts.by || byId(), ids: () => { const x = newId(); usedIds.push(x); return x; } });
  if(!r.ok){ if(!opts.silent) toast(t('err_'+r.code) !== 'err_'+r.code ? t('err_'+r.code, r.params) : t('err_generic'), true); return r; }
  state = E.reduce(state, r.writes);
  if(!opts.noRender) render();
  if(db && r.writes && r.writes.length){
    // supabase: one pseudo-write carries the action; the server re-runs it (server time, same ids when free)
    const toSend = BACKEND === 'supabase' ? [{ col:'__action', id:newId(), doc:{ action, ids:usedIds, at:now } }] : r.writes;
    if(await obSend(action.type, toSend, now, BACKEND === 'supabase' ? r.writes : undefined)){
      r.queued = true;
      if(!opts.noRender && opts.by !== 'system') obNoteSoon();
    }
  }
  return r;
}

function chime(){
  try{
    if(!audioCtx) return;
    const ctx = audioCtx, t0 = ctx.currentTime;
    [[784,0],[1047,.22]].forEach(([f,d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t0+d); g.gain.exponentialRampToValueAtTime(0.25, t0+d+.03); g.gain.exponentialRampToValueAtTime(0.0001, t0+d+.45);
      o.start(t0+d); o.stop(t0+d+.5);
    });
  }catch(e){}
}

/* ---------- T-14 activity log (HR only) ----------

/*ACTLOG*/const ACTLOG = {
  KINDS: ['time', 'roster', 'download', 'signin'],

    vtrack_id:'vtrackId', vtrackId:'vtrackId', program:'program', max_ratio:'maxRatio', maxRatio:'maxRatio', signoff_hour:'signoffHour', signoffHour:'signoffHour',
    work_days:'workDays', workDays:'workDays', start_time:'startTime', startTime:'startTime', early_clock_in_min:'earlyClockInMin', earlyClockInMin:'earlyClockInMin',
    active:'active', pay_anchor:'paySchedule', payAnchor:'paySchedule', pay_length:'paySchedule', payLength:'paySchedule', pay_date:'paySchedule', payDate:'paySchedule',
    run_settings:'run', run:'run', holidays:'holidays' },

  get(row, a, b){ if(!row) return undefined; return row[a] !== undefined ? row[a] : b ? row[b] : undefined; },
  same(a, b){ return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); },
  // who did it: 'hr' | 'coord:<site>' | provider id | 'system' / null
  whoOf(by, ctx, short){
    const t = ctx.t;
    if(by == null || by === '' || by === 'system') return t('alWhoSystem');
    if(by === 'hr') return t('alWhoHr');
    const s = String(by);
    if(s.indexOf('coord:') === 0){ const site = ctx.siteName(s.slice(6)); return short || !site ? t('alWhoCoordShort') : t('alWhoCoord', {site}); }
    return ctx.provider(s) || t('alWhoSomeone');

  day(d){ const [y, m, dd] = String(d).slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd, 12)); },
  fmtRange(from, to){

async function siAct(act, d){
  const S = siState();
  if(act === 'siAdd'){ S.edit = {id:null, rec:{name:'', maxRatio:4, signoffHour:18, workDays:[1,2,3,4,5], startTime:'', earlyClockInMin:null}}; S.edit.tried = false; render(); setTimeout(() => { const el = document.getElementById('si-name'); if(el) el.focus(); }, 0); return; }
  if(act === 'siEdit'){ const s = (state.roster.sites||[]).find(x => x.id === d.id); if(!s) return;
    S.edit = {id:s.id, rec:Object.assign({workDays:E.siteWorkDays(s).slice(), signoffHour:18}, s), tried:false}; render(); window.scrollTo({top:0}); return; }
  if(act === 'siCancel'){ S.edit = null; render(); return; }
  if(act === 'siSave'){
    const e = S.edit; if(!e) return;
    if(sensitiveIn(e.rec.name)){ e.tried = true; render(); sensitiveToast(); return; }
    const res = E.siteUpsert(state.roster, e.rec, e.id);
    if(!res.ok){ e.tried = true; render(); return; }
    if(await saveRoster(res.roster)){ S.edit = null; toast(t('siSaved',{name:String(e.rec.name).trim()})); }
    return;
  }
  if(act === 'siHolAdd'){
    const dEl = document.getElementById('si-hol-date'), nEl = document.getElementById('si-hol-name');
    const date = (dEl ? dEl.value : S.hol.date) || '', name = String((nEl ? nEl.value : S.hol.name) || '').trim().replace(/\s+/g,' ').slice(0,60);
    const list = config.holidays || [];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ S.holMsg = t('siHolNeedDate'); render(); return; }
    if(sensitiveIn(name)){ S.holMsg = t('err_SENSITIVE'); render(); sensitiveToast(); return; }
    if(list.some(h => h.date === date)){ S.holMsg = t('siHolDup',{date:siDate(date)}); render(); return; }
    config = Object.assign({}, config, {holidays: list.concat([{date, name}]).sort((a,b) => a.date.localeCompare(b.date))});
    S.hol = {date:'', name:''}; S.holMsg = null; await saveConfig(); toast(t('siHolAdded',{date:siDate(date)})); render(); return;
  }
  if(act === 'siHolDel'){
    config = Object.assign({}, config, {holidays: (config.holidays||[]).filter(h => h.date !== d.id)});
    S.holMsg = null; await saveConfig(); toast(t('siHolRemoved',{date:siDate(d.id)})); render(); return;
  }
}

  const ds = ev.target && ev.target.dataset; if(!ds) return;
  if(ds.si && ui.ro && ui.ro.si && ui.ro.si.edit) ui.ro.si.edit.rec[ds.si] = ev.target.value;
  if(ds.sihol && ui.ro && ui.ro.si) ui.ro.si.hol[ds.sihol] = ev.target.value;
});
document.addEventListener('change', ev => {
  const ds = ev.target && ev.target.dataset; if(!ds || !ui.ro || !ui.ro.si) return;
  const e = ui.ro.si.edit;
  if(ds.si && e){ e.rec[ds.si] = ds.si === 'earlyClockInMin' ? (ev.target.value === '' ? null : Number(ev.target.value)) : ev.target.value; render(); return; }
  if(ds.siday && e){ const i = Number(ds.siday); const wd = (Array.isArray(e.rec.workDays) ? e.rec.workDays.map(Number) : [1,2,3,4,5]).filter(x => x !== i);
    if(ev.target.checked) wd.push(i); e.rec.workDays = wd.sort((a,b)=>a-b); render(); return; }
});
async function saveRoster(next){
  const prev = state.roster;
  state = Object.assign({}, state, {roster: next});
  render();
  if(db){ try{ await db.doc('roster/main').set(next); }catch(e){ saveErrToast(e); return false; } }
  alRecord(ACTLOG.rosterDiff(prev, next));
  return true;
}
async function roAct(act, d){
  const r = rosterState();
  if(act === 'roTab'){ r.tab = d.id; r.edit = null; r.plan = null; r.cleared = false; render(); return; }
  if(act === 'roAdd'){ const isP = r.tab === 'providers'; r.edit = {kind: isP ? 'provider' : 'member', id: null, rec: isP ? {name:'', siteId: ui.siteId || (state.roster.sites[0]||{}).id, kind:'employee', payrollId:'', active:true} : {name:'', siteId: ui.siteId || (state.roster.sites[0]||{}).id, clientId:'', program:'', active:true}}; render(); setTimeout(() => { const el = document.getElementById('rf-name'); if(el) el.focus(); }, 0); return; }
  if(act === 'roEdit'){ const isP = r.tab === 'providers'; const o = (isP ? state.roster.providers : state.roster.members).find(x => x.id === d.id); if(!o) return;
    r.edit = {kind: isP ? 'provider' : 'member', id: o.id, rec: Object.assign({}, o)}; render(); window.scrollTo({top:0}); return; }
  if(act === 'roCancel'){ r.edit = null; render(); return; }
  if(act === 'roSave' || act === 'roToggle'){
    const e = r.edit; if(!e) return;
    const rec = Object.assign({}, e.rec); if(act === 'roToggle') rec.active = rec.active === false;
    if(sensitiveIn(rec.name, rec.payrollId, rec.clientId, rec.vtrackId)){ e.tried = true; render(); sensitiveToast(); return; }
    const res = E.rosterUpsert(state.roster, e.kind, rec, e.id);
    if(!res.ok){ e.tried = true; render(); return; }
    if(await saveRoster(res.roster)){ r.edit = null; toast(act === 'roToggle' ? t(rec.active === false ? 'roTurnedOff' : 'roTurnedOn', {name: rec.name}) : t('roSaved')); }
    return;
  }
  if(act === 'roRead'){
    const ta = document.getElementById('ri-text'); const text = ta ? ta.value : '';
    if(ta) ta.value = '';                       // never keep the raw paste (may contain SSN, phone, email)
    const isP = r.tab === 'providers';
    let parsed = isP ? E.parseStaffList(text).staff : E.parseClientList(text).clients;
    // members: keep only first name + last initial unless HR unticks it ("Tee H.")
    if(!isP && r.shortNames !== false) parsed = parsed.map(c => Object.assign({}, c, {name: shortName(c.first, c.last)}));
    const rows = E.rosterImportPlan(state.roster, isP ? 'provider' : 'member', parsed, {siteId: r.importSite || ui.siteId, kind: r.importKind});
    r.plan = {kind: isP ? 'provider' : 'member', rows}; r.pick = {}; r.cleared = true; r.importOpen = true; render();
    const nSens = rows.filter(x => x.reason === 'sensitive' || x.reason === 'payroll_sensitive' || x.reason === 'client_ssn' || x.reason === 'payroll_ssn').length;
    if(nSens) toast(t('roImportSensitive', {n: nSens}), true);
    return;
  }
  if(act === 'roPlanClear'){ r.plan = null; r.cleared = false; render(); return; }
  if(act === 'roApply'){
    if(!r.plan) return;
    const keys = r.plan.rows.filter(x => (x.action === 'add' || x.action === 'update') && r.pick[x.key] !== false).map(x => x.key);
    const out = E.rosterApplyPlan(state.roster, r.plan.kind, r.plan.rows, keys);
    if(await saveRoster(out.roster)){ toast(t('roPlanApplied', {n: out.applied})); r.plan = null; r.cleared = false; }
    return;
  }
}

  if(ui.pay.period === 'lastpay') pp = E.payPeriod(config.payAnchor || '2026-09-27', config.payLength || 14, E.addDays(pp.start, -1));

  const payDate = (E.paySchedule(config, from) || {}).payDate || null;
  const data = repData(E.weekStart(from), E.addDays(E.weekStart(to), 6));

    else if(pv.state === 'auto_signed_off') pill = `<span class="pill pill-offer num">${esc(t('st_auto',{time:tm(d.autoSignedOffAt)}))}</span>`;
    else if(pv.state === 'correction_pending') pill = `<span class="pill pill-offer">${esc(t('st_fix_pending'))}</span>`;
    else if(pv.state === 'corrected') pill = `<span class="pill pill-done num">${esc(t('st_corrected',{time:tm(d.finalEndAt)}))}</span>`;
    else if(pv.state === 'signed_off') pill = `<span class="pill pill-done num">${esc(t('st_signed_off',{time:tm(d.signedOffAt)}))}</span>`;
    else if(pv.state === 'free') pill = `<span class="pill pill-free num">${esc(t('st_free',{dur:dur(pv.freeSinceMin)}))}</span>`;
    else if(pv.state === 'offer') pill = `<span class="pill pill-offer">${esc(t('st_offer'))}</span>`;
    else pill = `<span class="pill pill-serving">${esc(t('st_serving',{n:pv.load}))}</span>`;
    const loadPill = d.clockedIn ? `<span class="pill pill-count num">${esc(pv.room <= 0 && pv.load > 0 && pv.load < s.maxRatio ? t('loadFullPair') : t('load',{n:pv.load, max:s.maxRatio}))}</span>` : '';
    const meta = (d.clockedIn ? `<span class="meta num">${esc(t('clockedSince',{time:tm(d.clockInAt)}))}</span>` : d.signedOff ? `<span class="meta num">${esc(t('inOut',{start:tm(d.clockInAt), end:tm(d.signedOffAt)}))}</span>` : d.autoSignedOff ? `<span class="meta num">${esc(t('inOut',{start:tm(d.clockInAt), end:tm(d.finalEndAt || d.autoSignedOffAt)}))}</span>` : '') + (d.shift ? photoThumb(d.shift, p.name) : '') + (d.shift ? geoTag(d.shift) : '');
    const notesPill = pv.notesMissing ? `<span class="pill pill-offer num">${esc(t('notesMissingPill',{n:pv.notesMissing}))}</span>` : pv.visitsEnded ? `<span class="pill pill-serving">${esc(t('notesDonePill'))}</span>` : '';
    const items = d.active.map(a => {
      const m = member(a.memberId);
      const mate = E.staffNeedOf(m) === 2 ? E.currentAssignments(eff(), a.memberId, date).filter(x => x.providerId !== p.id).map(x => first(provider(x.providerId).name)) : [];
      const pairTag = E.staffNeedOf(m) === 2 ? ` <span class="pill pill-offer">${esc(t('pairTag'))}</span>` : '';
      return `<div class="mitem"><div class="grow"><b>${esc(m.name)}</b>${pairTag}<small class="num">${esc(t('coordSince',{provider:first(p.name), time:tm(a.acceptedAt)}))} · ${esc(dur(E.visitMinutes(a, now)))}${mate.length ? ' · ' + esc(t('pairAlso',{names:mate.join(', ')})) : ''}</small></div>
        <button class="btn btn-sm" data-act="moveOpen" data-member="${esc(a.memberId)}" data-from="${esc(p.id)}">${esc(t('move'))}</button>
        <button class="btn btn-sm" data-act="coordLeaveOpen" data-id="${esc(a.id)}">${esc(t('left'))}</button></div>`;
    }).concat(d.offers.map(a => {
      const m = member(a.memberId);
      return `<div class="mitem pending"><div class="grow"><b>${esc(m.name)}</b><small class="num">${esc(t('pendingOffer',{member:first(m.name), dur:dur(E.minutesBetween(a.offeredAt, now))}))}</small></div>
        <button class="btn btn-sm" data-act="withdraw" data-id="${esc(a.id)}">${esc(t('cancelOffer'))}</button></div>`;
    })).join('');
    const give = d.clockedIn && pv.room > 0 && b.waiting.some(w => (w.need === 2 ? w.open > 0 : !w.offer)) ? `<div class="row-actions"><button class="btn btn-sm" data-act="pickMemberOpen" data-id="${esc(p.id)}">${esc(t('giveMember',{first:first(p.name)}))}</button></div>` : '';
    return `<div class="row prov${pv.state==='off'?' off':''}"><div class="row-top"><b>${esc(p.name)}</b>${pill}${loadPill}${notesPill}${meta}</div>
      ${items ? `<div class="mlist">${items}</div>` : ''}${give}</div>`;
  }).join('');

  const evs = b.events.slice(0,60);
  const log = evs.length ? `<ol class="log" tabindex="0" aria-label="${esc(t('logLabel'))}">${evs.map(e => `<li><time class="num">${esc(tm(e.at))}</time><span>${esc(evText(e))}</span></li>`).join('')}</ol>` : `<p class="empty">${esc(t('noActivity'))}</p>`;

  const empty = !b.events.length && !b.providers.some(p => p.day.clockedIn);
  const emptyBox = empty ? `<section class="panel"><h2>${esc(t('emptyBoardTitle',{site:s.name}))}</h2><p>${esc(t('emptyBoardText'))}</p></section>` : '';

  const past = E.openFixes(state, s.id, now).filter(f => f.date !== date);
  const pastBox = past.length ? `<section class="panel"><h2>${esc(t('earlierDays'))}</h2>${past.map(f => {
    const nm = f.provider ? f.provider.name : '';
    const c = f.correction && f.correction.status === 'pending' ? f.correction : null;
    return `<div class="alert warn"><p><b>${esc(fmtDay(f.date))}</b> · ${esc(c ? t('alertFix',{provider:nm, time:tm(c.claimedEndAt), reason:t('cr_'+c.reason)}) : (f.correction && f.correction.status === 'rejected') ? t('alertRejected',{provider:nm, cut:tm(f.shift.autoSignedOffAt)}) : t('alertAuto',{provider:nm, time:tm(f.shift.autoSignedOffAt)}))}</p>
      <div class="row-actions">${c ? `<button class="btn btn-sm primary" data-act="reviewOpen" data-id="${esc(c.id)}">${esc(t('review'))}</button>` : `<button class="btn btn-sm primary" data-act="cfOpen" data-id="${esc(f.shift.id)}">${esc(t('fixMyself'))}</button>`}</div></div>`;
  }).join('')}</section>` : '';
  const autoBtn = b.providers.some(x => x.day.clockedIn) ? `<button class="btn btn-sm btn-line" data-act="autoAsk">${esc(t('autoRun'))}</button>` : '';
  let clearUi = ui.autoAsk
    ? `<span class="grow" style="color:var(--alert);font-weight:700">${esc(t('autoAsk',{site:s.name}))}</span><button class="btn btn-sm" data-act="autoNo">${esc(t('cancel'))}</button><button class="btn btn-sm primary" data-act="autoYes">${esc(t('autoYes'))}</button>`
    : autoBtn ? `<span class="grow"></span>${autoBtn}` : '';
  

  return `<main class="board">
    <div class="board-head"><h1>${esc(t('coordTitle'))}</h1><div class="sites" role="group" aria-label="${esc(t('site'))}">${sites}</div></div>
    ${viewTabs()}
    
    ${counts}${alerts}${pastBox}${emptyBox}
    <div class="cols">
      <section class="panel" id="fl-wait"><h2 tabindex="-1">${esc(t('cWaiting'))} <span class="pill pill-count num">${b.waiting.length}</span></h2>${waiting}${later}</section>
      <section class="panel" id="fl-prov"><h2 tabindex="-1">${esc(t('providers'))}</h2>${provs}</section>
    </div>
    <section class="panel"><h2>${esc(t('activity'))}</h2>${log}</section>
    ${clearUi ? `<div class="foot">${clearUi}</div>` : ''}
  </main>`;
}
// Floor counters: tap to jump to the matching part of the Floor (handy on a phone)
function floorJump(kind){
  const wait = document.getElementById('fl-wait'), prov = document.getElementById('fl-prov');
  const provRows = prov ? [...prov.querySelectorAll('.row.prov')] : [];
  let el = null;
  if(kind === 'offers') el = (wait && wait.querySelector('.row-pending')) || provRows.find(r => r.querySelector('.mitem.pending'));
  else if(kind === 'free') el = provRows.find(r => r.querySelector('.pill-free'));
  else if(kind === 'serving') el = provRows.find(r => r.querySelector('.mitem:not(.pending)'));
  const box = kind === 'wait' || kind === 'offers' ? wait : prov, target = el || box;
  if(!target) return;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  target.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: el ? 'center' : 'start' });
  const h = box && box.querySelector('h2'); if(h) h.focus({ preventScroll: true });
  target.classList.add('jump-hi'); setTimeout(() => target.classList.remove('jump-hi'), 1800);
}
function evText(e){
  const p = {member: e.memberId ? member(e.memberId).name : '', provider: e.providerId ? provider(e.providerId).name : '', from: e.fromProviderId ? provider(e.fromProviderId).name : ''};
  if(e.type === 'decline') p.reason = t('declineShort_'+(e.reason||'other'));
  if(e.type === 'memberLeft') p.reason = t('reason_'+(e.reason||'other'));
  if(e.type === 'correctionDecided') p.decision = t('dec_'+(e.decision||'approve'));
  if(e.type === 'autoSignOff') p.count = e.count;
  if(e.type === 'notes') return t(e.done ? 'ev_notes_done' : 'ev_notes_undone', p);
  return t('ev_'+e.type, p);
}

/* ----- sheets ----- */
function drawSheet(){
  const el = document.getElementById('sheet');
  const sh = ui.sheet;
  if((!sh || sh.kind !== 'photo') && cam.state !== 'idle') camStop();
  if(!sh){ el.innerHTML = ''; lastSheet = ''; return; }
  const body = sheetBody(sh);
  if(!body){ ui.sheet = null; el.innerHTML=''; lastSheet = ''; return; }
  if(body === lastSheet) return;
  if(document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && el.contains(document.activeElement)) return;
  const fresh = !lastSheet || sh._fresh;
  sh._fresh = false; lastSheet = body;
  el.innerHTML = `<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">${body}</div></div>`;
  if(fresh){ const f = el.querySelector('h2'); if(f){ f.setAttribute('tabindex','-1'); f.focus({preventScroll:true}); } }
}
function sheetBody(sh){
  if(sh.kind === 'photo') return photoSheet();
  if(sh.kind === 'photoView') return photoViewSheet(sh);
  const now = Date.now(), date = today();
  const a = sh.assignmentId ? (state.assignments||[]).find(x => x.id === sh.assignmentId) : null;
  if(sh.kind === 'leave' || sh.kind === 'coordLeave'){
    if(!a || a.status !== 'active') return null;
    const m = member(a.memberId), f = first(m.name);
    if(sh.step === 'confirm'){
      return `<h2 id="sheet-h">${esc(t('confirmEndTitle',{first:f}))}</h2><p class="lead">${esc(t('confirmEndText',{first:f, provider:provider(a.providerId).name}))}</p>
        <button class="btn btn-accent" data-act="leaveDo" data-method="coordinator_reported">${I.door}${esc(t('confirmEndYes',{first:f}))}</button>
        <button class="btn btn-quiet" data-act="leaveBack">${esc(t('back'))}</button>`;
    }
    if(sh.step === 'sign'){
      return `<h2 id="sheet-h">${esc(t('signTitle',{first:f}))}</h2><p class="lead">${esc(t('signText',{first:f}))}</p>
        <button class="btn btn-go" style="min-height:96px;font-size:24px" data-act="leaveDo" data-method="member_signed">${I.pen}${esc(t('memberSigns',{first:f}))}</button>
        <p class="or">${esc(t('or'))}</p>
        <button class="btn btn-line" data-act="leaveDo" data-method="provider_reported">${esc(t('providerConfirms',{first:f}))}</button>
        <button class="btn btn-quiet" data-act="leaveBack">${esc(t('back'))}</button>`;
    }
    const reasons = ['went_home','picked_up','appointment','not_feeling_well','other'];
    const coord = sh.kind === 'coordLeave';
    return `<h2 id="sheet-h">${esc(t(coord?'coordLeaveTitle':'leaveTitle',{name:m.name}))}</h2><p class="lead">${esc(t(coord?'coordLeaveAsk':'leaveAsk',{first:f}))}</p>
      ${reasons.map(r => `<button class="opt" data-act="leaveReason" data-reason="${r}">${esc(t('reason_'+r))}</button>`).join('')}
      <button class="btn btn-quiet" data-act="close">${esc(t('cancel'))}</button>`;
  }
  if(sh.kind === 'decline'){
    if(!a || a.status !== 'offered') return null;
    const m = member(a.memberId), f = first(m.name);
    return `<h2 id="sheet-h">${esc(t('declineTitle',{first:f}))}</h2>
      ${['full','break','leaving','fit','other'].map(r => `<button class="opt" data-act="declineDo" data-reason="${r}">${esc(t('decline_'+r,{first:f}))}</button>`).join('')}
      <button class="btn btn-quiet" data-act="close">${esc(t('cancel'))}</button>`;
  }
  if(sh.kind === 'assign' || sh.kind === 'move'){
    const m = member(sh.memberId), f = first(m.name);
    const b = E.board(eff(), ui.siteId, date, now);
    const curs = E.currentAssignments(eff(), m.id, date);
    const cur = sh.kind === 'move' ? (curs.find(x => x.providerId === sh.fromProviderId) || curs[curs.length-1]) : curs[curs.length-1];
    if(sh.kind === 'move' && !cur) return null;
    const site0 = siteOf(ui.siteId)||{}, max = site0.maxRatio;
    const pairW = E.staffNeedOf(m) === 2 && E.pairLoadOf(site0) === 'all' ? Math.max(1, max||1) : 1;
    const opts = b.providers.map(pv => {
      const p = pv.provider;
      let sub, ok = false;
      if(curs.some(x => x.providerId === p.id)) sub = t('opt_current',{first:f});
      else if(pv.state === 'signed_off') sub = t('opt_signed_off');
      else if(!pv.day.clockedIn) sub = t('opt_off');
      else if(pv.room <= 0) sub = t('opt_full',{n:pv.load+pv.day.offers.length, max});
      else if(pv.room < pairW) sub = t('opt_pairBusy');
      else { ok = true; sub = pv.state === 'free' ? t('opt_free',{dur:dur(pv.freeSinceMin)}) : t('opt_room',{n:pv.load, max}); }
      return {p, sub, ok, sortKey:(ok?0:1)*1000 + (pv.state==='free'?0:1)*100 + pv.load};
    }).sort((x,y)=>x.sortKey-y.sortKey);
    const others = curs.filter(x => x !== cur || sh.kind !== 'move');
    const note = (sh.kind === 'move' && cur && cur.status === 'active'
      ? t('moveNote',{provider:provider(cur.providerId).name, first:f}) : t('assignNote',{first:f}))
      + (E.staffNeedOf(m) === 2 ? ' ' + (sh.kind === 'assign' && others.length ? t('pairSecond',{first:f, provider:provider(others[0].providerId).name}) : t('pairNeeds',{first:f})) : '');
    return `<h2 id="sheet-h">${esc(t(sh.kind==='move'?'moveTitle':'assignTitle',{name:m.name}))}</h2>
      <p class="note">${esc(note)}</p>
      ${sheetSearch(sh, opts.map(o => o.p.name), t('qProviders'))}
      ${opts.map(o => `<button class="opt" ${o.ok?'':'disabled'}${qHit(o.p.name, sh.q)?'':' hidden'} data-qname="${esc(o.p.name)}" data-act="${sh.kind==='move'?'moveDo':'assignDo'}" data-id="${esc(o.p.id)}"><span class="avatar">${esc(initials(o.p.name))}</span><span class="grow">${esc(o.p.name)}<small class="num">${esc(o.sub)}</small></span></button>`).join('')}
      <button class="btn btn-quiet" data-act="close">${esc(t('cancel'))}</button>`;
  }
  if(sh.kind === 'review'){
    const c = corrById(sh.correctionId);
    if(!c || c.status !== 'pending') return null;
    const shf = shiftById(c.shiftId); if(!shf) return null;
    const pr = provider(c.providerId);
    const visits = (state.assignments||[]).filter(a => a.providerId === c.providerId && a.date === c.date && a.status === 'ended');
    const conf = (c.conflicts||[]).map(x => `<li>${esc(t('rv_'+x.kind,{member:member(x.memberId).name, time:tm(x.at)}))}</li>`).join('');
    const dec = sh.decision || '';
    const needC = dec === 'adjust' || dec === 'reject' || (dec === 'approve' && (c.conflicts||[]).length);
    return `<h2 id="sheet-h">${esc(t('rvTitle',{name:pr.name}))}</h2>
      <dl class="facts num"><dt>${esc(t('rvDay'))}</dt><dd>${esc(fmtDay(c.date))}</dd><dt>${esc(t('rvIn'))}</dt><dd>${esc(tm(shf.clockInAt))}</dd>
      <dt>${esc(t('rvAuto'))}</dt><dd>${esc(tm(shf.autoSignedOffAt))}</dd><dt>${esc(t('rvSays'))}</dt><dd>${esc(tm(c.claimedEndAt))}</dd>
      <dt>${esc(t('rvWhy'))}</dt><dd>${esc(t('cr_'+c.reason))}</dd><dt>${esc(t('rvSent'))}</dt><dd>${esc(fmtDay(E.dateKey(c.submittedAt)))} ${esc(tm(c.submittedAt))}</dd></dl>
      ${conf ? `<div class="conflict"><b>${esc(t('rvConflictsTitle'))}</b><ul>${conf}</ul></div>` : ''}
      <p class="group-label">${esc(t('rvVisits'))}</p>
      <ul class="done-list" style="margin:0;padding-top:0;border:0">${visits.map(a => `<li><span>${esc(member(a.memberId).name)}<small class="num">${esc(tm(a.acceptedAt))} – ${esc(tm(a.endedAt))}${a.endReason==='auto_signoff'?' · '+esc(t('rvClosed')):''}</small><small>${a.notesCompleted?`<span class="ok-mark">${I.check}${esc(t('notesDone'))}</span>`:`<span class="todo-mark">! ${esc(t('notesTodoTitle'))}</span>`}</small></span></li>`).join('') || `<li>${esc(t('coNoVisits'))}</li>`}</ul>
      <p class="group-label">${esc(t('rvDecision'))}</p>
      <button class="opt" aria-pressed="${dec==='approve'}" data-act="rvDec" data-dec="approve"><span class="grow">${esc(t('rv_approve',{time:tm(c.claimedEndAt)}))}</span></button>
      <button class="opt" aria-pressed="${dec==='adjust'}" data-act="rvDec" data-dec="adjust"><span class="grow">${esc(t('rv_adjust'))}</span></button>
      ${dec==='adjust' ? `<div class="field"><label for="rv-time">${esc(t('rvTime'))}</label><input id="rv-time" type="time" data-bind="sheet.time" value="${esc(sh.time||'')}" min="${hhmm(shf.clockInAt)}" max="${hhmm(shf.autoSignedOffAt)}"><span class="muted" style="font-size:15px">${esc(t('fTimeHelp',{in:tm(shf.clockInAt), cut:tm(shf.autoSignedOffAt)}))}</span></div>` : ''}
      <button class="opt" aria-pressed="${dec==='reject'}" data-act="rvDec" data-dec="reject"><span class="grow">${esc(t('rv_reject'))}</span></button>
      ${dec ? warnBox(timeWarnings(c.providerId, c.date, dec==='adjust' ? toMs(c.date, sh.time) : dec==='approve' ? c.claimedEndAt : null)) : ''}
      ${dec ? `<div class="field"><label for="rv-comment">${esc(t('rvCommentSee',{first:first(pr.name)}))}${needC ? '' : ' \u00b7 ' + esc(t('rvCommentOpt'))}</label><textarea id="rv-comment" data-bind="sheet.comment" class="${sh.badComment?'invalid':''}">${esc(sh.comment||'')}</textarea>${needC?`<span class="muted" style="font-size:15px">${esc(t('rvCommentNeed'))}</span>`:''}</div>` : ''}
      <button class="btn btn-accent" data-act="rvSave" ${dec?'':'disabled'}>${esc(t('rvSave'))}</button>
      <button class="btn btn-quiet" data-act="close">${esc(t('cancel'))}</button>`;
  }
  if(sh.kind === 'cf'){
    const shf = shiftById(sh.shiftId);
    if(!shf || shf.status !== 'auto_signed_off') return null;
    const pr = provider(shf.providerId), cut = shf.autoSignedOffAt, f = first(pr.name);
    const la = lastActivity(shf.providerId, shf.date, cut);
    if(sh.time === undefined) sh.time = la ? hhmm(la.at) : hhmm(cut);
    if(sh.keep === undefined) sh.keep = false;
    const lr = latestRejected(shf.id);
    const endAt = sh.keep ? cut : toMs(shf.date, sh.time);
    const visits = (state.assignments||[]).filter(a => a.providerId === shf.providerId && a.date === shf.date && a.status === 'ended');
    return `<h2 id="sheet-h">${esc(t('cfTitle',{name:pr.name}))}</h2>
      <p class="lead">${esc(lr && lr.status === 'rejected' ? t('cfTextRejected',{first:f, cut:tm(cut)}) : t('cfText',{first:f, cut:tm(cut)}))}</p>
      <dl class="facts num"><dt>${esc(t('rvDay'))}</dt><dd>${esc(fmtDay(shf.date))}</dd><dt>${esc(t('rvIn'))}</dt><dd>${esc(tm(shf.clockInAt))}</dd><dt>${esc(t('rvAuto'))}</dt><dd>${esc(tm(cut))}</dd></dl>
      <p class="group-label">${esc(t('rvVisits'))}</p>
      <ul class="done-list" style="margin:0;padding-top:0;border:0">${visits.map(a => `<li><span>${esc(member(a.memberId).name)}<small class="num">${esc(tm(a.acceptedAt))} \u2013 ${esc(tm(a.endedAt))}${a.endReason==='auto_signoff'?' \u00b7 '+esc(t('rvClosed')):''}</small></span></li>`).join('') || `<li>${esc(t('coNoVisits'))}</li>`}</ul>
      <button class="opt" aria-pressed="${!!sh.keep}" data-act="cfKeep" data-v="1"><span class="grow">${esc(t('cfKeep',{cut:tm(cut)}))}</span></button>
      <p class="or">${esc(t('or'))}</p>
      <button class="opt" aria-pressed="${!sh.keep}" data-act="cfKeep" data-v="0"><span class="grow">${esc(t('cfSet'))}</span></button>
      ${sh.keep ? '' : `<div class="field"><label for="cf-time">${esc(t('cfTimeLabel',{first:f}))}</label><input id="cf-time" type="time" data-bind="sheet.time" value="${esc(sh.time||'')}" min="${hhmm(shf.clockInAt)}" max="${hhmm(cut)}"><span class="muted" style="font-size:15px">${esc(t('fTimeHelp',{in:tm(shf.clockInAt), cut:tm(cut)}))}</span></div>`}
      ${warnBox(timeWarnings(shf.providerId, shf.date, endAt))}
      <div class="field"><label for="cf-comment">${esc(t('rvCommentSee',{first:f}))}</label><textarea id="cf-comment" data-bind="sheet.comment" class="${sh.badComment?'invalid':''}">${esc(sh.comment||'')}</textarea><span class="muted" style="font-size:15px">${esc(t('rvCommentNeed'))}</span></div>
      <button class="btn btn-accent" data-act="cfSave">${esc(t('cfSave'))}</button>
      <button class="btn btn-quiet" data-act="close">${esc(t('cancel'))}</button>`;
  }
  if(sh.kind === 'suRole') return SU.sheet();
  if(sh.kind === 'pickMember'){
    const p = provider(sh.providerId);
    const b = E.board(eff(), ui.siteId, date, now);
    const ws = b.waiting.filter(w => (w.need === 2 ? w.open > 0 && !w.withNow.concat(w.offers||[]).some(a => a.providerId === sh.providerId) : !w.offer));
    return `<h2 id="sheet-h">${esc(t('pickMemberTitle',{name:p.name}))}</h2>
      <p class="note">${esc(t('assignNoteAny'))}</p>
      ${ws.length ? sheetSearch(sh, ws.map(w => w.member.name), t('qMembers')) : ''}
      ${ws.length ? ws.map(w => `<button class="opt"${qHit(w.member.name, sh.q)?'':' hidden'} data-qname="${esc(w.member.name)}" data-act="pickMemberDo" data-member="${esc(w.member.id)}"><span class="avatar">${esc(initials(w.member.name))}</span><span class="grow">${esc(w.member.name)}<small class="num">${esc(t('waitingFor',{dur:dur(w.waitMin)}))}${w.need === 2 ? ' · ' + esc(t('pairPill',{n:w.withNow.length})) : ''}</small></span></button>`).join('') : `<p class="empty">${esc(t('noneWaiting'))}</p>`}
      <button class="btn btn-quiet" data-act="close">${esc(t('cancel'))}</button>`;
  }
  return null;
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
