/* ---------- T-13: HR alert when the scheduled server auto sign-off did not run (prod build only) ----------
   Reads public.missed_auto_signoffs() (HR only): (site, date) in the last 7 days whose cutoff passed more than
   30 minutes ago with no successful run. The manual "Run auto sign-off" on the Floor stays the fallback. */
const T13 = {
  missed: [], at: 0, busy: false,
  async load(){
    if(T13.busy || !SB.client || !SB.me || ['hr','admin'].indexOf(SB.me.role) < 0 || Date.now() - T13.at < 5 * 60000) return;
    T13.busy = true; T13.at = Date.now();
    try{ const r = await SB.client.rpc('missed_auto_signoffs'); if(!r.error){ T13.missed = Array.isArray(r.data) ? r.data : []; render(); } }
    catch(e){} finally{ T13.busy = false; }
  },
  banner(){
    T13.load();

function eodData(siteId, date){
  const data = repData(date, date); if(!data) return null;
  const now = Date.now();
  const f = {from:date, to:date, siteId};
  const rows = E.timesheetRows(data, f, now);
  const visits = E.visitRows(data, f, now);
  const att = E.attendance(data, {from:date, to:date, siteId, today: today(), holidays: config.holidays}, now);
  const absentProv = att.people.filter(p => p.cells[0] && p.cells[0].status === 'absent').map(p => p.name);
  const served = {}; visits.forEach(v => { (served[v.memberName] = served[v.memberName] || []).push(v); });
  const ci = (data.checkins||[]).filter(c => c.date === date && c.siteId === siteId);
  const absentMem = (state.roster.members||[]).filter(m => m.siteId === siteId && m.active !== false && !ci.some(c => c.memberId === m.id) && !served[m.name]).map(m => m.name).sort((a,b) => a.localeCompare(b));
  const fixes = [];
  rows.forEach(r => {
    if(r.status === 'open') fixes.push(t('eodFixOpen',{name:r.providerName}));
    else if(r.status === 'correction_pending' && r.correction) fixes.push(t('eodFixPending',{name:r.providerName, time: r.correction.claimedEndAt ? tm(r.correction.claimedEndAt) : '?', reason: t('cr_'+(r.correction.reason||'other'))}));
    else if(r.status === 'auto_unverified') fixes.push(t('eodFixAuto',{name:r.providerName, time: r.endAt ? tm(r.endAt) : '6:00 PM'}));
    if(r.notesTotal > r.notesDone) fixes.push(t('eodFixNotes',{name:r.providerName, n:r.notesTotal - r.notesDone}));
  });
  const sum = {
    worked: rows.length, absent: absentProv.length,
    presenceMin: rows.reduce((a,r) => a + (r.presenceMin||0), 0),
    members: Object.keys(served).length, memAbsent: absentMem.length,
    withMemberMin: rows.reduce((a,r) => a + (r.withMemberMin||0), 0),
    units: rows.reduce((a,r) => a + (r.units||0), 0),
    notesDone: rows.reduce((a,r) => a + (r.notesDone||0), 0), notesTotal: rows.reduce((a,r) => a + (r.notesTotal||0), 0)
  };
  const memRows = Object.keys(served).sort((a,b) => a.localeCompare(b)).map(name => {
    const vs = served[name].slice().sort((a,b) => a.acceptedAt - b.acceptedAt);
    const m = (state.roster.members||[]).find(x => x.name === name) || {};

      minutes: vs.reduce((a,v) => a + (v.minutes||0), 0), left: vs[vs.length-1].endedAt, notes: vs.every(v => v.notesCompleted) };
  });

}

  async signOut(reason){
    if(SBA.out) return; SBA.out = true; SBA.hideWarn();
    // send anything this person still has queued (offline actions) before the session ends
    try{ if(db && outbox.items.length && navigator.onLine !== false) await Promise.race([obFlush(), new Promise(r => setTimeout(r, 3000))]); }catch(e){}
    try{ if(PUSH.sub || PUSH.state === 'on') await PUSH.off(true); }catch(e){} // a shared phone must not keep alerting for the last person
    try{ if(SB.client) await Promise.race([SB.client.auth.signOut({ scope: 'local' }), new Promise(r => setTimeout(r, 3000))]); }catch(e){}
    try{ const k = SBA.authKey(); if(k) localStorage.removeItem(k); }catch(e){} // gone even when offline
    LS.set('role', null); LS.set('me', null);
    try{ sessionStorage.setItem('vh2.signedOut', reason === 'idle' ? 'idle' : 'user'); }catch(e){}
    SBA.reload();
  },
  reload(){ location.reload(); }, // a clean page: nothing of the previous person stays in memory
  // queued (offline) actions belong to the person who made them: park them while someone else is signed in
  claimOutbox(uid){
    const owner = LS.get('obOwner', null), held = LS.get('obHeld', {}) || {};
    if(owner && owner !== uid && outbox.items.length){ held[owner] = (held[owner] || []).concat(outbox.items); outbox.items = []; }
    if(held[uid]){ outbox.items = held[uid].concat(outbox.items); delete held[uid]; }
    LS.set('obHeld', held); obSave(); LS.set('obOwner', uid);

  tick(){
    const now = Date.now(), o = SBA.lim();

      if(SBA.warn) SBA.hideWarn();
      if(SB.blocked && SB.why === 'signin' && SBA.mode !== 'start' && !SBA.busy && now - SBA.last > o.provider){ SBA.go('start'); } // half-typed PIN on a kiosk

    if(SBA.out) return;

    if(r && r.ok){
      if(r.login){ const L = { user_id: r.login.userId, role: r.login.role, site_id: r.login.siteId, provider_id: r.login.providerId, login_name: r.login.loginName, active: r.login.active, is_primary: r.login.primary === true };
        SBA.logins = (SBA.logins || []).filter(x => x.user_id !== L.user_id).concat([L]); }
      if(r.secret){ SBA.ro.shown = { role: r.login.role, secret: String(r.secret), name: name || SBA.loginLabel({ role: r.login.role, provider_id: r.login.providerId, login_name: r.login.loginName }), at: Date.now() };
        ui.focusTop = false; window.scrollTo(0, 0); }
    }
    render();
    if(r && r.ok && SBA.ro.shown){ setTimeout(() => { const h = document.getElementById('sb-secret-h'); if(h) h.focus({ preventScroll: false }); }, 50); }
    return r;
  },
  async onClick(el){
    const d = el.dataset, k = d.sb;
    if(k === 'pwShow'){ const inp = document.getElementById('sb-pass'); if(!inp) return; const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; const lb = t(show ? 'sbPwHide' : 'sbPwShow'); el.setAttribute('aria-label', lb); el.title = lb; el.innerHTML = show ? I.eyeOff : I.eye; return; }
    if(k === 'pinShow'){ SBA.pinShow = !SBA.pinShow; SBA.paint('[data-sb=pinShow]'); return; }
    if(k === 'mode') return SBA.go(d.mode);
    if(k === 'start') return SBA.go('start');
    if(k === 'names') return SBA.go('names');
    if(k === 'retry') return SBA.loadNames();
    if(k === 'pick'){ SBA.pick = (SBA.names || []).find(n => n.id === d.id) || null; if(SBA.pick){ SBA.mode = 'pin'; SBA.pin = ''; SBA.pinShow = false; SBA.msg = ''; SBA.paint('#sb-h'); window.scrollTo(0, 0); } return; }
    if(k === 'key') return SBA.press(d.k);
    if(k === 'out') return SBA.signOut('user');
    if(k === 'stay'){ SBA.last = Date.now(); return SBA.hideWarn(); }
    if(k === 'secretDone'){ SBA.ro.shown = null; render(); return; }
    if(k === 'bulkGo') return SBA.bulkGo();
    if(k === 'bulkPrint'){ try{ window.print(); }catch(e){} return; }
    if(k === 'bulkRe'){ SBA.bulk.confirm = true; render(); return; }
    if(k === 'bulkReNo'){ SBA.bulk.confirm = false; render(); return; }
    if(k === 'bulkReGo') return SBA.bulkReGo();
    if(k === 'bulkDone'){ SBA.bulk.pins = null; SBA.bulk.failed = []; render(); return; }
    if(k === 'staffAdd'){ SBA.ro.form = { loginName: '', role: 'coordinator', siteId: ((state.roster.sites || []).find(s => s.active !== false) || {}).id || '' }; SBA.ro.msg = ''; render(); setTimeout(() => { const i = document.getElementById('sb-nu'); if(i) i.focus(); }, 30); return; }
    if(k === 'staffEdit'){ const L = (SBA.logins || []).find(x => x.user_id === d.id); if(!L) return;
      SBA.ro.form = { editId: L.user_id, loginName: L.login_name || '', role: L.role, siteId: L.site_id || ((state.roster.sites || []).find(s => s.active !== false) || {}).id || '', primary: !!L.is_primary, providerId: L.provider_id || '' };
      SBA.ro.msg = ''; render(); setTimeout(() => { const i = document.getElementById('sb-nr'); if(i) i.focus(); }, 30); return; }
    if(k === 'staffCancel'){ SBA.ro.form = null; SBA.ro.msg = ''; render(); return; }
    if(k === 'roCreate'){ const p = provider(d.id); const r = await SBA.run({ action: 'createLogin', role: 'provider', providerId: d.id }, p.name); if(r && !r.ok) toast(SBA.errText(r.code), true); return; }
    if(k === 'roReset'){ const L = (SBA.logins || []).find(x => x.user_id === d.id); const r = await SBA.run({ action: 'setSecret', userId: d.id }, SBA.loginLabel(L)); if(r && !r.ok) toast(SBA.errText(r.code), true); return; }
    if(k === 'roActive'){ const L = (SBA.logins || []).find(x => x.user_id === d.id); const on = d.on === '1';
      const r = await SBA.run({ action: 'setActive', userId: d.id, active: on });
      if(r && r.ok) toast(t(on ? 'sbOnToast' : 'sbOffToast', { name: SBA.loginLabel(L) })); else if(r) toast(SBA.errText(r.code), true);
      return; }
  },
  // ---- HR: sign-ins for everyone at once + a printable PIN sheet (PINs live only on this screen, never saved) ----
  bulk: { running: false, done: 0, total: 0, pins: null, failed: [], at: 0 },
  bulkHave(){ return (state.roster.providers || []).filter(p => p.active !== false).map(p => ({ p, L: SBA.loginFor(p.id) })).filter(x => x.L && x.L.active).sort((a, b) => E.byLastName(a.p.name, b.p.name)); },
  async bulkReGo(){
    const B = SBA.bulk; if(B.running) return;
    const have = SBA.bulkHave(); if(!have.length) return;
    Object.assign(B, { confirm: false, running: true, done: 0, total: have.length, pins: [], failed: [], at: Date.now() }); render();
    for(const x of have){
      let r; try{ r = await SBA.admin({ action: 'setSecret', userId: x.L.user_id }); }catch(e){ r = { ok: false, code: 'NET' }; }
      if(r && r.ok && r.secret) B.pins.push({ name: x.p.name, pin: String(r.secret) }); else B.failed.push(x.p.name);
      B.done++; render();
    }
    B.running = false; render(); window.scrollTo(0, 0);
    setTimeout(() => { const h = document.getElementById('sb-pins-h'); if(h) h.focus(); }, 50);
  },
  bulkNeed(){ return (state.roster.providers || []).filter(p => p.active !== false && !SBA.loginFor(p.id)).sort((a, b) => E.byLastName(a.name, b.name)); },
  bulkBox(){
    if(!SBA.logins) return '';
    const B = SBA.bulk, need = SBA.bulkNeed();
    if(B.pins){
      const rows = B.pins.slice().sort((a, b) => E.byLastName(a.name, b.name));
      return `<section class="panel sb-pins" aria-labelledby="sb-pins-h"><h2 id="sb-pins-h" tabindex="-1">${esc(t('sbBulkSheetTitle'))}</h2>
        <p class="no-print">${esc(t('sbBulkSheetNote'))}</p>
        <div class="scroll" tabindex="0" role="region" aria-label="${esc(t('sbBulkSheetTitle'))}"><table class="tbl sb-pin-tbl"><thead><tr><th scope="col">${esc(t('pcName'))}</th><th scope="col">${esc(t('sbBulkPin'))}</th><th scope="col">${esc(t('sbBulkHow'))}</th></tr></thead><tbody>
        ${rows.map(r => `<tr><th scope="row">${esc(E.lastFirst(r.name))}</th><td class="num sb-pin">${esc(r.pin.slice(0, 3) + ' ' + r.pin.slice(3))}</td><td>${esc(t('sbBulkHowText'))}</td></tr>`).join('')}</tbody></table></div>
        ${B.failed.length ? `<p class="banner">${esc(t('sbBulkFailed', { names: B.failed.join(', ') }))}</p>` : ''}
        <div class="row-actions no-print"><button class="btn btn-sm primary btn-accent" data-sb="bulkPrint">${esc(t('sbBulkPrint'))}</button><button class="btn btn-sm btn-line" data-sb="bulkDone">${esc(t('sbBulkDone'))}</button></div></section>`;
    }
    if(B.running) return `<section class="panel" aria-live="polite"><h2>${esc(t('sbBulkTitle'))}</h2><p class="num">${esc(t('sbBulkProgress', { done: B.done, total: B.total }))}</p></section>`;
    if(!need.length){
      const have = SBA.bulkHave(); if(!have.length) return '';
      return `<section class="panel"><h2>${esc(t('sbReTitle'))}</h2><p>${esc(t('sbReHelp', { n: have.length }))}</p>
        ${B.confirm ? `<p class="banner" role="alert">${esc(t('sbReWarn', { n: have.length }))}</p>
        <div class="row-actions"><button class="btn btn-sm primary btn-accent" data-sb="bulkReGo"${SBA.ro.busy ? ' disabled' : ''}>${esc(t('sbReYes', { n: have.length }))}</button><button class="btn btn-sm btn-quiet" data-sb="bulkReNo">${esc(t('sbCancel'))}</button></div>`
        : `<div class="row-actions"><button class="btn btn-sm btn-line" data-sb="bulkRe"${SBA.ro.busy ? ' disabled' : ''}>${esc(t('sbReBtn'))}</button></div>`}</section>`;
    }
    return `<section class="panel"><h2>${esc(t('sbBulkTitle'))}</h2><p>${esc(t('sbBulkHelp', { n: need.length }))}</p>
      <div class="row-actions"><button class="btn btn-sm primary btn-accent" data-sb="bulkGo"${SBA.ro.busy ? ' disabled' : ''}>${esc(t('sbBulkGo', { n: need.length }))}</button></div></section>`;
  },
  async bulkGo(){
    const B = SBA.bulk; if(B.running) return;
    const need = SBA.bulkNeed(); if(!need.length) return;
    Object.assign(B, { running: true, done: 0, total: need.length, pins: [], failed: [], at: Date.now() }); render();
    for(const p of need){
      let r; try{ r = await SBA.admin({ action: 'createLogin', role: 'provider', providerId: p.id }); }catch(e){ r = { ok: false, code: 'NET' }; }
      if(r && r.ok && r.secret){
        B.pins.push({ name: p.name, pin: String(r.secret) });
        const L = { user_id: r.login.userId, role: 'provider', site_id: r.login.siteId, provider_id: r.login.providerId, login_name: null, active: true };
        SBA.logins = (SBA.logins || []).filter(x => x.user_id !== L.user_id).concat([L]);
      } else B.failed.push(p.name);
      B.done++; render();
    }
    B.running = false; render(); window.scrollTo(0, 0);
    setTimeout(() => { const h = document.getElementById('sb-pins-h'); if(h) h.focus(); }, 50);
  },
  async staffAdd(){
    const F = SBA.ro.form; if(!F) return;
    if(F.editId){
      const body = { action: 'updateLogin', userId: F.editId, role: F.role };
      if(F.role === 'coordinator'){ body.siteId = F.siteId; body.primary = !!F.primary; }
      if(F.role === 'admin') body.providerId = F.providerId || null;
      const r = await SBA.run(body, F.loginName);
      if(r && r.ok){ SBA.ro.form = null; SBA.loadLogins().then(render); render(); }
      else if(r){ SBA.ro.msg = SBA.errText(r.code); render(); }
      return;
    }
    const body = { action: 'createLogin', role: ['hr', 'admin'].indexOf(F.role) >= 0 ? F.role : 'coordinator', loginName: String(F.loginName || '').trim().toLowerCase() };
    if(body.role === 'coordinator'){ body.siteId = F.siteId; body.primary = !!F.primary; }
    if(body.role === 'admin' && F.providerId) body.providerId = F.providerId;
    const r = await SBA.run(body, body.loginName);
    if(r && r.ok){ SBA.ro.form = null; render(); }
    else if(r){ SBA.ro.msg = SBA.errText(r.code); window.__roForce = 'sb-nu'; render(); }
  }
};
Object.assign(T.en, {
  sbReTitle:'Lost the PIN sheet?', sbReHelp:'PINs are never saved, so they cannot be shown again. You can give all {n} providers a new PIN and print a new sheet.',
  sbReBtn:'New PINs for everyone', sbReWarn:'Every old PIN stops working right away. Only do this if the old sheet was not handed out, or you can hand out the new one now.',
  sbReYes:'Yes, make {n} new PINs',
  sbBulkTitle:'Sign-ins for everyone', sbBulkHelp:'{n} active providers have no sign-in yet. Create them all at once and print a PIN sheet.',
  sbBulkGo:'Create {n} sign-ins', sbBulkProgress:'Making PINs: {done} of {total}…',
  sbBulkSheetTitle:'PIN sheet', sbBulkSheetNote:'Print this now and give each person only their own PIN. PINs are not saved anywhere: when you leave this screen (or after 15 minutes) they are gone. A lost PIN is replaced with New PIN.',
  sbBulkPin:'PIN', sbBulkHow:'How to sign in', sbBulkHowText:'Tap "I work with members", tap your name, type this PIN.',
  sbBulkPrint:'Print PIN sheet', sbBulkDone:'Done, hide PINs', sbBulkFailed:'Could not create a sign-in for: {names}. Try again with Create sign-in on their row.'
});
// prod wording: the person button signs out (there is no role picker)
T.en.switchUser = T.en.sbSignOut; T.en.notYou = T.en.sbNotYouOut;
// one client for the whole page; after connecting, park other people's queued actions and load HR's sign-in list
const sbConnect0 = SB.connect;
SB.connect = async function(){
  const got = await sbConnect0.apply(SB, arguments);
  if(got && SB.client){
    try{ const s = await SB.client.auth.getSession(); const uid = s && s.data && s.data.session && s.data.session.user && s.data.session.user.id; if(uid) SBA.claimOutbox(uid); }catch(e){}
    SBA.last = Date.now();
    if(SB.me && (SB.me.role === 'hr' || SB.me.role === 'admin')) SBA.loadLogins();
  }
  return got;
};
try{ const why = sessionStorage.getItem('vh2.signedOut'); if(why){ sessionStorage.removeItem('vh2.signedOut'); SBA.msg = t(why === 'idle' ? 'sbIdleOut' : 'sbOutDone'); } }catch(e){}
// "Change person" / "Not you?" -> sign out (runs before the app's own click handler)
document.addEventListener('click', ev => {
  const sw = ev.target && ev.target.closest && ev.target.closest('[data-act="switch"]');
  if(sw){ ev.preventDefault(); ev.stopImmediatePropagation(); SBA.signOut('user'); }
}, true);
document.addEventListener('click', ev => { const el = ev.target && ev.target.closest && ev.target.closest('[data-sb]'); if(el && !el.disabled) SBA.onClick(el); });
document.addEventListener('submit', ev => {
  const f = ev.target && ev.target.dataset && ev.target.dataset.sbform; if(!f) return;
  ev.preventDefault();
  if(f === 'staff') SBA.submit('staff'); else if(f === 'staffAdd') SBA.staffAdd();
});
document.addEventListener('input', ev => {
  const id = ev.target && ev.target.id;
  if(id === 'sb-q'){ SBA.q = ev.target.value; const box = document.getElementById('sb-list'); if(box) box.innerHTML = SBA.listHtml(); lastApp = SB.panel(); }
  else if(id === 'sb-user') SBA.user = ev.target.value;
  else if(id === 'sb-nu' && SBA.ro.form) SBA.ro.form.loginName = ev.target.value;
});
document.addEventListener('change', ev => {
  const id = ev.target && ev.target.id;
  if(id === 'sb-nr' && SBA.ro.form){ SBA.ro.form.role = ev.target.value; window.__roForce = 'sb-nr'; render(); }
  else if(id === 'sb-ns' && SBA.ro.form) SBA.ro.form.siteId = ev.target.value;
  else if(id === 'sb-np' && SBA.ro.form) SBA.ro.form.primary = ev.target.value === '1';
  else if(id === 'sb-nv' && SBA.ro.form) SBA.ro.form.providerId = ev.target.value;
});
document.addEventListener('keydown', ev => {
  if(!(SB.blocked && SBA.mode === 'pin') || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tg = ev.target && ev.target.tagName; if(tg === 'INPUT' || tg === 'TEXTAREA') return;
  if(/^\d$/.test(ev.key)){ ev.preventDefault(); SBA.press(ev.key); }
  else if(ev.key === 'Backspace'){ ev.preventDefault(); SBA.press('back'); }
});
['pointerdown', 'keydown', 'touchstart', 'wheel', 'input'].forEach(n => window.addEventListener(n, () => SBA.bump(), { capture: true, passive: true }));
setInterval(() => SBA.tick(), 1000);

/* ---------- shared data ---------- */
async function connect(){
  try{
    let got = null;
    if(BACKEND === 'supabase') got = await SB.connect(); else{
      if(!window.claude || !window.claude.use) return;
      got = await window.claude.use('db');
    }
    if(!got) return;
    db = got;
    obStart();
    const since = E.dateKey(Date.now() - 8*24*3600*1000);
    loadedSince = since;
    db.collection('downloadLog').orderBy('at','desc').limit(20).onSnapshot(sn => { ui.dlLog = sn.docs.map(x => x.data()); render(); }, ()=>{});
    db.doc('roster/main').onSnapshot(s => {
      const r = s.exists ? s.data() : null;
      if(r && Array.isArray(r.sites) && r.sites.length) { state = Object.assign({}, state, {roster:r}); render(); }
      else if(BACKEND === 'supabase' && SB.roster) { state = Object.assign({}, state, {roster:SB.roster}); render(); } // fresh project: nothing set up yet
    }, ()=>{});
    db.doc('config/main').onSnapshot(s => { config = configBase = Object.assign({practice:false, payAnchor:'2026-09-27', payLength:14, payDate:'2026-10-16', run:{}}, s.exists ? s.data() : {}); render(); }, ()=>{});
    ['shifts','checkins','assignments','events','corrections'].forEach(col => {
      db.collection(col).where('date','>=',since).onSnapshot(snap => {
        state = Object.assign({}, state, {[col]: snap.docs.map(d => d.data())});
        state = obOverlay(state);
        render();
      }, ()=>{});
    });
    render();
  }catch(e){ db = null; }
}

/* ---------- boot ---------- */
let sweeping = false;
async function sweep(){
  if(sweeping) return; sweeping = true;
  try{
    const now = Date.now(), tdy = today();
    const todo = {};
    (state.shifts||[]).forEach(sh => { if(sh.status === 'clocked_in') todo[sh.siteId + '|' + sh.date] = [sh.siteId, sh.date]; });
    for(const k in todo){
      const [siteId, date] = todo[k];
      if(date === tdy && config.practice) continue;
      const cutoffAt = E.cutoffFor(state, siteId, date);
      if(now >= cutoffAt) await act({type:'autoSignOff', siteId, cutoffAt}, {by:'system', silent:true});
    }
  }finally{ sweeping = false; }
}
setInterval(() => { render(); sweep(); }, 20000);
setTimeout(sweep, 1500);
initDownloads();
draw();
connect();
})();
